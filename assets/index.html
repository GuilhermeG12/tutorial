<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>TeclaCifra</title>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff; --soft:#f5f5f6; --text:#222222; --muted:#707078; --line:#e7e7ea;
  --orange:#ff6600; --orange-d:#e65c00; --orange-soft:#fff1e6;
  --bass:#2f6fe4; --white-key:#ffffff; --black-key:#2b2b30; --key-line:#b9bdc6;
  --mono:"Roboto Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 8px;display:flex;align-items:center;gap:4px;height:54px}
.top h1{font-size:19px;margin:0 0 0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.brand b{color:var(--orange)}
.ibtn{background:transparent;border:0;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.ibtn:active{background:var(--soft)}
.ibtn svg{width:24px;height:24px}
main{padding:12px 16px 100px;max-width:860px;margin:0 auto}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-size:16px;outline:none}
.search:focus{border-color:var(--orange);background:var(--bg)}
.list{margin-top:12px;display:flex;flex-direction:column}
.item{padding:12px 4px;display:flex;align-items:center;gap:12px;cursor:pointer;border-bottom:1px solid var(--line)}
.item:active{background:var(--soft)}
.item .n{color:var(--muted);font-weight:700;min-width:22px;text-align:right}
.item .t{font-weight:600}
.item .a{color:var(--muted);font-size:14px}
.item .k{margin-left:auto;color:var(--orange);font-weight:700;font-size:15px;flex:none}
.empty{color:var(--muted);text-align:center;padding:40px 10px;line-height:1.5}
.fab{position:fixed;right:18px;bottom:80px;width:56px;height:56px;border-radius:50%;background:var(--orange);color:#fff;border:0;box-shadow:0 4px 14px rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer;z-index:15}
.fab svg{width:26px;height:26px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:20}
.nav button{flex:1;background:none;border:0;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer}
.nav button.on{color:var(--orange);font-weight:700}
.nav svg{width:23px;height:23px}
/* ----- música (padrão Cifra Club) ----- */
.song{padding-top:14px;padding-bottom:190px}
.st{font-size:27px;line-height:1.15;margin:0;font-weight:700;color:var(--text)}
.sa{font-size:17px;margin:4px 0 0;font-weight:400;color:var(--muted)}
.sm{margin:12px 0 16px;font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.tomb{background:none;border:0;padding:0;color:var(--orange);font-weight:700;font-size:16px;cursor:pointer}
.unsaved{background:var(--orange-soft);border:1px solid #ffd2b0;border-radius:12px;padding:10px 12px;margin:0 0 16px;font-size:14px;display:flex;align-items:center;gap:10px}
.unsaved span{flex:1}
pre.cifra{font-family:var(--mono);white-space:normal;line-height:1.6;margin:0;color:var(--text);width:100%;max-width:100%;min-width:0}
.score-source{overflow-x:auto;overscroll-behavior-x:contain}
.score-source-line{white-space:pre;display:block;width:max-content;min-width:100%;min-height:1.6em;tab-size:8}
.score-phrase{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:.65ch;row-gap:.3em;margin:0 0 .45em;max-width:100%}
.score-word{display:inline-flex;flex-direction:column;flex:0 1 auto;min-width:0;max-width:100%}
.score-harmony{display:none;white-space:pre-wrap;overflow-wrap:anywhere;max-width:100%;line-height:1.6}
.score-harmony:not(:empty){display:block;min-height:1.6em}
.score-lyric{white-space:normal;overflow-wrap:anywhere;max-width:100%}
.score-instrumental{display:flex;flex-wrap:wrap;gap:.25em 1.5ch;max-width:100%;margin-bottom:.4em}
.score-instrumental .c{max-width:100%;overflow-wrap:anywhere}
.score-heading{white-space:normal;overflow-wrap:anywhere;margin:.4em 0 .2em}
.score-gap{height:.8em}
.c{color:var(--orange);font-weight:700;cursor:pointer;border-radius:3px}
.c.agora{background:var(--orange);color:#fff}
.c.mk-ok{text-decoration:underline 2px #1f8a3b;text-underline-offset:3px}
.c.mk-err{text-decoration:underline wavy 2px #c62828;text-underline-offset:3px}
.cifra.corrigindo .c{outline:1px dashed var(--orange);outline-offset:1px}
.syncui{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 10px}
.bagora{display:flex;align-items:baseline;gap:10px;margin:6px 0 10px}.bagora b{font-family:var(--mono);font-size:30px;color:var(--orange)}
.bchips{display:flex;flex-wrap:wrap;gap:5px;max-height:230px;overflow:auto;margin:6px 0 14px}.bchips span{border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-family:var(--mono);font-size:14px}.bchips b{color:var(--orange)}.bchips small{color:var(--muted);margin-left:4px;font-size:11px}.bchips .duv{opacity:.4}
body.tocando{padding-top:204px}body.tocando .top{top:204px}body.tocando .cbar.pinned,body.tocando .cbar.open{top:258px}
.c:active,.c.hl{background:var(--orange-soft)}
.sec{color:var(--text)}
.tgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tgrid button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0 7px;font-weight:700;font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tgrid button small{font-size:9px;font-weight:600;color:var(--muted)}
.tgrid button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.tgrid button.on small{color:#fff}
.cmp{font-size:14px;border-radius:10px;padding:9px 12px;margin:0 0 14px;line-height:1.4}
.cmp.ok{background:#e9f7ef;color:#1b6b3a}.cmp.bad{background:#fff4e5;color:#8a4b00}.cmp.wait{background:var(--soft);color:var(--muted)}
.fim{display:block;text-align:center;color:var(--muted);font-size:.85em}
.miss{background:#eaf2ff}
.dw{color:#d43c3c;text-decoration:underline wavy #d43c3c;cursor:pointer}
.dwn{color:#d43c3c;font-size:.8em;font-weight:700;cursor:pointer}
.misstag{color:var(--bass);font-size:.8em;font-weight:700}
.spin{width:22px;height:22px;border:3px solid var(--orange-soft);border-top-color:var(--orange);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;align-items:center;gap:12px;color:var(--muted);padding:14px 4px;font-size:15px}
.srcl{font-size:12px;font-weight:700;margin-left:auto;flex:none}
.schips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.schips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer}
.schips button.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
/* barra de acordes */
.cbar{display:none;background:var(--bg);border-bottom:1px solid var(--line);z-index:25;box-shadow:0 6px 14px rgba(0,0,0,.08)}
.cbar.pinned{display:block;position:sticky;top:54px}
.cbar.open{display:block;position:fixed;top:54px;left:0;right:0}
.cbh{display:flex;align-items:center;gap:6px;padding:6px 10px 0}
.cbh .ttl{font-size:13px;font-weight:700;color:var(--muted);flex:1}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px}
.pill svg{width:14px;height:14px}
.pill.on{background:var(--orange);border-color:var(--orange);color:#fff}
.cbs{display:flex;gap:8px;overflow-x:auto;padding:8px 10px 10px;scroll-behavior:smooth;align-items:flex-end}
.cc{flex:none;border:1.5px solid var(--line);border-radius:10px;padding:5px 7px 4px;cursor:pointer;text-align:center;background:var(--bg)}
.cc b{display:block;color:var(--orange);font-size:14px;margin-bottom:3px}
.cc.cur{border-color:var(--orange)}
.cc.sel{border-color:var(--orange);background:var(--orange-soft);padding:6px 9px}
.cc.sel b{font-size:18px}
.cc .nt{font-size:11px;color:var(--muted);margin-top:3px}
.cc svg{display:block;margin:0 auto}
/* barra inferior da música */
.stb{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:22}
.stb button{flex:1;background:none;border:0;padding:7px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#444;cursor:pointer}
.stb button.on{color:var(--orange);font-weight:700}
.stb button.hot{color:var(--orange)}
.stb svg{width:22px;height:22px}
.panel{position:fixed;left:0;right:0;bottom:58px;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.08);padding:12px 16px;z-index:21;display:none}
.panel.show{display:block}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.step button{background:var(--bg);border:0;width:46px;height:42px;font-size:20px;font-weight:700;cursor:pointer}
.step button:active{background:var(--orange-soft)}
.step .v{min-width:46px;text-align:center;font-weight:700;color:var(--orange);font-size:17px}
.plnav{position:fixed;left:0;right:0;bottom:58px;background:var(--soft);border-top:1px solid var(--line);display:flex;align-items:center;z-index:20;font-size:14px}
.plnav button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--orange)}
.plnav button:disabled{color:#bbb}
.plnav span{flex:1;text-align:center;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type=range]{accent-color:var(--orange);flex:1;min-width:140px}
/* janelas */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:20px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}
.chk input{width:20px;height:20px;accent-color:var(--orange)}
.chk small{color:var(--muted);margin-left:auto}
/* formulários e cartões */
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
input.in,textarea.in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;outline:none}
input.in:focus,textarea.in:focus{border-color:var(--orange)}
textarea.in{min-height:46vh;font-family:var(--mono);font-size:14px;white-space:pre;overflow-x:auto}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--orange);color:#fff;font-size:15px}
.btn.sm{padding:8px 12px;font-size:14px;flex:none}
.btn.ghost{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--bg);color:#d43c3c;border:1px solid #d43c3c}
.hint{font-size:13px;color:var(--muted);line-height:1.55}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.src{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--bg)}
.src:active{background:var(--soft)}
.src .num{color:var(--muted);font-weight:700;width:18px;text-align:right}
.src .lg{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.src .t{font-weight:700}
.src .a{font-size:13px;color:var(--muted)}
.src .go{margin-left:auto;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.roots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.roots button,.types button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 0;cursor:pointer;font-weight:600}
.roots button.on,.types button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.types button{font-size:13px;padding:9px 2px}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--orange);color:#fff;border-color:var(--orange)}
.kbwrap{overflow-x:auto}
.kbwrap svg{display:block;max-width:100%;height:auto}
/* playlist em modo edição */
.pli{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);background:var(--bg);user-select:none;-webkit-user-select:none}
.pli.drag{box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:10px;position:relative;z-index:5}
.handle{touch-action:none;cursor:grab;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none}
.handle svg{width:22px;height:22px}
.pli .tx{flex:1;min-width:0}
.pli .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw;text-align:center}

:root[data-theme="dark"]{color-scheme:dark;--bg:#15171c;--soft:#222630;--text:#edf0f7;--muted:#aeb6c6;--line:#363d4c;--orange:#ff9b57;--orange-d:#ffb47e;--orange-soft:#3c2a1f;--bass:#82b0ff}
:root[data-theme="dark"] .unsaved{border-color:#775034}
:root[data-theme="dark"] .cmp.ok{background:#183a2b;color:#a9e4bd}
:root[data-theme="dark"] .cmp.bad{background:#3d2e18;color:#f3ce92}
:root[data-theme="dark"] .toast{background:#e6e9f2;color:#15171c}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger),:root[data-theme="dark"] .fab{color:#21160f}
.theme-toggle{min-width:44px;font-size:23px}
</style>
</head>
<body>
<div id="app"></div>
<script src="neural-score.js"></script>
<script src="score-layout.js"></script>
<script src="request-bridge.js"></script>
<script>
"use strict";
/* ================= Música: notas e acordes ================= */
const SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT =['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const NOTE_IDX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,'E#':5,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11,'B#':0};
const SUF="(?:maj|min|dim|aug|sus|add|m|M|[0-9]|[#b+\\-°ºø]|\\/[#b]?[0-9]+|\\((?:[0-9#b+\\-\\/,]|M|maj|add)*\\))*";
const CHORD_RE=new RegExp("^([A-G])([#b]?)("+SUF+")(?:\\/([A-G])([#b]?))?$");
const NEUTRAL_RE=/^(\|+|-+|\(?\d*x\d*\)?|%|\.{2,}|\/|:|N\.?C\.?|\*|\(|\))$/i;
const TAB_RE=/^\s*[A-Ga-g][#b]?\s*\|[-0-9|hpbrsx\/\\~().\s]*$/;

function parseChord(s){
  const m=CHORD_RE.exec(s); if(!m) return null;
  return {root:m[1]+m[2], suffix:m[3]||'', bass:m[4]?m[4]+m[5]:null};
}
// separa parênteses/colchetes soltos em volta do acorde: "(C" -> pre "(", acorde "C"
function splitTok(t){
  for(let pre=0;pre<=2;pre++) for(let post=0;post<=2;post++){
    if(pre+post>=t.length) continue;
    const a=t.slice(0,pre), b=t.slice(t.length-post);
    if(!/^[(\[]*$/.test(a)||!/^[)\],]*$/.test(b)) continue;
    const core=t.slice(pre,t.length-post); const p=parseChord(core);
    if(p) return {pre:a,core,post:b,p};
  }
  return null;
}
function nameOf(i,flats){i=((i%12)+12)%12;return (flats?FLAT:SHARP)[i]}
function simplifySuffix(s){
  if(/^(dim|°|º)/.test(s)) return '°';
  if(/^ø/.test(s)||/m7?\(?b5|m7?\(?5-/.test(s)) return '°';
  if(/^(aug|\+)/.test(s)) return '+';
  if(/^(m(?!aj)|min)/.test(s)) return 'm';
  return '';
}
function transformChord(p,shift,flats,simple){
  const suf=simple?simplifySuffix(p.suffix):p.suffix;
  const r=shift?nameOf(NOTE_IDX[p.root]+shift,flats):p.root;
  const b=p.bass?(shift?nameOf(NOTE_IDX[p.bass]+shift,flats):p.bass):null;
  return r+suf+(b?'/'+b:'');
}
// intervalos (em semitons) a partir do sufixo — segue a convenção brasileira de cifras
function intervals(suffix){
  let s=suffix.replace(/º/g,'°').replace(/\s/g,'')
    .replace(/5-/g,'b5').replace(/5\+/g,'#5').replace(/9-/g,'b9').replace(/9\+/g,'#9')
    .replace(/11\+/g,'#11').replace(/13-/g,'b13').replace(/\/(?=[#b]?\d)/g,',');
  if(s==='5') return [0,7];
  let third=4, fifth=7, sev=null; const ext=new Set();
  if(/^ø/.test(s)){third=3;fifth=6;sev=10;s=s.slice(1);}
  else if(/^(dim|°)/.test(s)){third=3;fifth=6;const deg=s[0]==='°';s=s.replace(/^(dim|°)/,'');
    if(/^7/.test(s)){sev=9;s=s.slice(1);} else if(deg) sev=9;}
  else if(/^(min|m(?!aj))/.test(s)){third=3;s=s.replace(/^(min|m)/,'');}
  if(/^(aug|\+)/.test(s)){fifth=8;s=s.replace(/^(aug|\+)/,'');}
  const re=/(maj7|7M|M7|7\+|sus4|sus2|sus|add9|add11|add2|add4|b5|#5|b9|#9|#11|b13|13|11|9|7|6|4|2)/g;
  let t;
  while((t=re.exec(s))){
    switch(t[1]){
      case 'maj7':case '7M':case 'M7':case '7+': sev=11;break;
      case '7': if(sev===null) sev=10;break;
      case '6': ext.add(9);break;
      case 'sus4':case 'sus':case '4': third=5;break;
      case 'sus2': third=2;break;
      case 'add9':case 'add2':case '9':case '2': ext.add(14);break;
      case 'add11':case 'add4':case '11': ext.add(17);break;
      case 'b5': fifth=6;break;
      case '#5': fifth=8;break;
      case 'b9': ext.add(13);break;
      case '#9': ext.add(15);break;
      case '#11': ext.add(18);break;
      case 'b13': ext.add(20);break;
      case '13': if(sev===null) sev=10; ext.add(21);break;
    }
  }
  const out=[0,third,fifth]; if(sev!==null) out.push(sev);
  ext.forEach(e=>out.push(e));
  return [...new Set(out)].sort((a,b)=>a-b);
}
// posição no teclado: {notes:[alturas da mão direita], bass:altura|null}
function voicing(chordStr,inv){
  const p=parseChord(chordStr); if(!p) return null;
  const r=NOTE_IDX[p.root]; const ivs=intervals(p.suffix);
  let notes=ivs.map(i=>r+i);
  const core=Math.min(notes.length, ivs.filter(i=>i<12).length);
  inv=Math.min(inv||0, core-1);
  for(let k=0;k<inv;k++){notes.sort((a,b)=>a-b);notes[0]+=12;}
  notes.sort((a,b)=>a-b);
  let bass=null;
  if(p.bass){bass=NOTE_IDX[p.bass]; if(bass>=notes[0]) notes=notes.map(n=>n+12);} // baixo sempre abaixo do acorde
  return {notes,bass,core,p};
}
function isFlatKey(idx,minor){
  idx=((idx%12)+12)%12;
  return minor?[2,7,0,5,10,3].includes(idx):[5,10,3,8,1].includes(idx);
}

/* ================= Teclado (SVG) ================= */
const WHITE_OF=[0,0,1,1,2,3,3,4,4,5,5,6]; const IS_BLACK=[0,1,0,1,0,0,1,0,1,0,1,0];
// dedilhado da mão direita (1 = polegar … 5 = mindinho)
const FINGERS={1:[1],2:[1,5],3:[1,3,5],4:[1,2,3,5],5:[1,2,3,4,5]};
function keyboardSVG(v,o){
  o=o||{}; const big=o.size==='big';
  const all=v.notes.concat(v.bass!==null?[v.bass]:[]);
  const mx=Math.max(...all), mn=Math.min(...all), pc=p=>((p%12)+12)%12;
  let lo,end,octs;
  if(big){ lo=Math.floor(mn/12)*12; octs=Math.max(2,Math.ceil((mx+1-lo)/12)); end=lo+octs*12; }
  else { // mini: só o trecho usado, com uma tecla branca de folga de cada lado
    lo=mn-1; while(IS_BLACK[pc(lo)]) lo--;
    end=mx+1; while(IS_BLACK[pc(end)]) end++;
    end++; octs=(end-lo)/12;
  }
  const W=big?(octs>2?15:21):11, H=big?104:44;
  const BW=Math.round(W*.62), BH=Math.round(H*.62), TOP=o.fingers?24:0;
  const wx={}; let nWhite=0;
  for(let p=lo;p<end;p++) if(!IS_BLACK[pc(p)]) wx[p]=(nWhite++)*W;
  const on=new Set(v.notes);
  const fmap={}; const fs=FINGERS[Math.min(5,v.notes.length)]||[];
  v.notes.forEach((n,i)=>{ if(i<fs.length) fmap[n]=fs[i]; });
  const xw=p=>wx[p];
  let w='',b='',lbl='',fg='';
  for(let p=lo;p<end;p++){
    const isOn=on.has(p), isB=p===v.bass;
    const fill=isOn?'var(--orange)':isB?'var(--bass)':null;
    let cx,ty;
    if(!IS_BLACK[pc(p)]){
      w+=`<rect x="${xw(p)+.5}" y="${TOP+.5}" width="${W-1}" height="${H}" rx="${big?3:2}" fill="${fill||'var(--white-key)'}" stroke="var(--key-line)"/>`;
      cx=xw(p)+W/2; ty=TOP+H-8;
      if(fill&&big) lbl+=`<text x="${cx}" y="${ty}" font-size="${octs>2?9:11}" font-weight="700" text-anchor="middle" fill="#fff">${nameOf(p,o.flats)}</text>`;
    }else{
      const x=xw(p-1)+W-BW/2;
      b+=`<rect x="${x}" y="${TOP+.5}" width="${BW}" height="${BH}" rx="${big?2:1}" fill="${fill||'var(--black-key)'}" stroke="var(--key-line)" stroke-width=".5"/>`;
      cx=x+BW/2; ty=TOP+BH-6;
      if(fill&&big) lbl+=`<text x="${cx}" y="${ty}" font-size="${octs>2?7:9}" font-weight="700" text-anchor="middle" fill="#fff">${nameOf(p,o.flats)}</text>`;
    }
    if(o.fingers&&(isOn||isB)){
      const f=isB?5:fmap[p]; const col=isB?'var(--bass)':'var(--orange)';
      if(f) fg+=`<circle cx="${cx}" cy="11" r="9" fill="#fff" stroke="${col}" stroke-width="2"/><text x="${cx}" y="15" font-size="11" font-weight="700" text-anchor="middle" fill="${col}">${f}</text>`;
    }
  }
  const tw=nWhite*W+1;
  return `<svg viewBox="0 0 ${tw} ${TOP+H+1}" width="${tw}" height="${TOP+H+1}" role="img" aria-label="Teclado">${fg}${w}${b}${lbl}</svg>`;
}

async function quickSearch(q){

function fetchPage(url,mode){
 const k=mode+'|'+url,cached=pageCache.get(k);
 if(cached&&Date.now()-cached.at<600000)return Promise.resolve(cached.value);
 if(inflight.has(k))return inflight.get(k);
 const pr=TeclaRequests.page(native,url,mode).then(d=>{
  if(d&&typeof d==='object'&&!d.error&&(d.text||d.lines||d.results&&d.results.length||d.id)){
   pageCache.delete(k);pageCache.set(k,{at:Date.now(),value:d});
   while(pageCache.size>40)pageCache.delete(pageCache.keys().next().value);
  }
  return d;
 }).finally(()=>inflight.delete(k));
 inflight.set(k,pr);return pr;
}

// link de música (YouTube, Spotify, Deezer, SoundCloud) → "nome da música artista" para buscar a cifra
const isMusicLink=q=>{try{const u=new URL(String(q).trim());return /^https?:$/.test(u.protocol)&&['youtube.com','youtu.be','spotify.com','deezer.com','deezer.page.link','soundcloud.com'].some(h=>u.hostname===h||u.hostname.endsWith('.'+h));}catch(e){return false}};
async function resolveLink(url){
  if(!(native&&native.httpGet)) return null;
  url=url.trim(); const e=encodeURIComponent(url); let title='',artist='';
  if(/youtube\.com|youtu\.be/i.test(url)){const d=await httpGet('https://www.youtube.com/oembed?format=json&url='+e); if(d&&d.title){title=d.title;artist=d.author_name||''}}
  else if(/spotify\.com/i.test(url)){const d=await httpGet('https://open.spotify.com/oembed?url='+e); if(d&&d.title) title=d.title}
  else if(/soundcloud\.com/i.test(url)){const d=await httpGet('https://soundcloud.com/oembed?format=json&url='+e); if(d&&d.title){title=d.title;artist=d.author_name||''}}
  else if(/deezer/i.test(url)){
    let m=/deezer\.com\/(?:[a-z]{2}\/)?track\/(\d+)/i.exec(url);
    if(!m&&/page\.link|link\.deezer/i.test(url)){const h=await httpGet(url); m=typeof h==='string'&&/track\/(\d+)/.exec(h)}
    if(m){const d=await httpGet('https://api.deezer.com/track/'+m[1]); if(d&&d.title){title=d.title;artist=(d.artist&&d.artist.name)||''}}
  }
  if(!title) return null;
  // tira "(Clipe Oficial)", "[Ao Vivo]", "| Canal" etc.
  title=title.split('|')[0].replace(/\(.*?\)|\[.*?\]/g,' ')
    .replace(/\b(clipe|v[ií]deo|oficial|official|ao vivo|live|lyric|lyrics|letra|[aá]udio|audio|hd|4k|music video)\b/gi,' ').replace(/\s+/g,' ').trim();
  artist=artist.replace(/\s*-\s*topic$|vevo$|\b(oficial|official)\b/gi,'').trim();
  return /\s-\s/.test(title)||!artist?title.replace(/\s-\s/,' '):title+' '+artist;
}

function ytUrl(song){
  const y=(song.yt||'').trim();
  if(/^[\w-]{11}$/.test(y)) return 'https://www.youtube.com/watch?v='+y;
  if(/^https?:\/\//i.test(y)) return y;
  if(/^(www\.)?(youtube\.com|youtu\.be|m\.youtube\.com)\//i.test(y)) return 'https://'+y;
  return null;
}

  switch(parts[0]){
    case 'song': return viewSong(songById(parts[1]),parts[2]||null);

// Buscar: Cifra Club + Google restrito ao Cifra Club (acha por trecho da letra e com erro de digitação)
async function runSearch(q,live){
 q=String(q||'').trim();if(!q)return;
 const token=++srch.token;TeclaRequests.cancelQueued();srch.q=q;srch.loading=false;srch.error='';
 if(navigator.onLine===false){renderSearch();return;}
 if(isMusicLink(q)){
  srch.loading=true;srch.results=[];renderSearch();
  try{const name=await resolveLink(q);if(token!==srch.token)return;
   if(!name)throw Error('Não consegui identificar a música deste link. Pesquise pelo nome.');
   const inp=document.getElementById('sq');if(inp)inp.value=name;return runSearch(name,false);
  }catch(e){if(token===srch.token){srch.error=e.message;srch.loading=false;renderSearch();}}return;
 }
 if(!live){recent=[q,...recent.filter(x=>norm(x)!==norm(q))].slice(0,8);store.set('tc_recent',recent);document.activeElement&&document.activeElement.blur();}
 const src=SOURCES.find(x=>x.id===srch.src)||SOURCES[0];
 const query=src.id==='all'?q+' cifra':'site:'+src.host+' '+q+' cifra';
 const web=()=>fetchPage('https://www.google.com/search?hl=pt-BR&q='+encodeURIComponent(query),'web').then(d=>{
  if(!d||d.error)throw Error(d&&d.error||'A fonte não respondeu. Tente novamente ou abra a pesquisa no navegador.');
  return Array.isArray(d.results)?d.results:[];
 });
 const jobs=live?[()=>quickSearch(q)]:src.id==='cc'||src.id==='all'?[()=>quickSearch(q),web]:[web];
 srch.results=[];srch.loading=true;renderSearch();let left=jobs.length;
 await Promise.all(jobs.map(async(job,rank)=>{
  try{
   const list=await job();if(token!==srch.token)return;
   const seen=new Set(srch.results.map(r=>r.url.replace(/\/$/,'')));
   for(const r of Array.isArray(list)?list:[]){
    if(!r||typeof r.url!=='string')continue;
    let u;try{u=new URL(r.url);}catch(e){continue;}
    if(!/^https?:$/.test(u.protocol))continue;
    const k=u.href.replace(/\/$/,'');if(seen.has(k))continue;seen.add(k);
    srch.results.push({title:String(r.title||u.hostname),artist:String(r.artist||''),url:u.href,rank});
   }
   const nq=norm(q),ws=nq.split(' ').filter(Boolean);
   const score=r=>{const t=norm(r.title).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();return t===nq?0:t.startsWith(nq)?1:t.includes(nq)?2:ws.every(w=>t.includes(w))?3:4;};
   srch.results.sort((a,b)=>score(a)-score(b)||a.rank-b.rank);
  }catch(e){if(token===srch.token)srch.error=e.message||'Falha na consulta.';}
  finally{if(token===srch.token){if(--left===0)srch.loading=false;if(location.hash==='#/busca')renderSearch();}}
 }));
}

function renderSearch(){
  const el=document.getElementById('sres'); if(!el) return;
  if(!native){el.innerHTML='<div class="empty">A busca na internet funciona no app Android.</div>';return}
  if(navigator.onLine===false){el.innerHTML=`<div class="empty"><b>Sem internet.</b><br>Verifique sua conexão e tente novamente.<br>Suas músicas salvas continuam funcionando.</div>${srch.q?`<button class="btn" style="width:100%" onclick="doSearch(srch.q)">Tentar de novo</button>`:''}`;return}

    el.innerHTML=(recent.length?`<div class="row" style="margin-top:14px"><b style="font-size:14px;color:var(--muted)">Pesquisas recentes</b><button class="btn ghost sm" onclick="clearRecent()">Limpar histórico</button></div><div class="chips">${recent.map((r,i)=>`<button onclick="document.getElementById('sq').value=recent[${i}];doSearch(recent[${i}])">${esc(r)}</button>`).join('')}</div>`:'')+
      '<div class="empty">Digite a música e toque em Buscar.</div>';
    return;

function openImported(d,keepVersions){
  const dup=d.url&&songs.find(s=>s.url===d.url||(s.variants&&s.variants[d.url]));
  if(dup){toast('Você já tem esta cifra salva');history.replaceState(null,'','#/song/'+dup.id);route();return}

function applyVariant(url){

function chooseVersion(i){
  const v=cur.versions[i]; closeSheet();
  if(String(v.url).replace(/\/$/,'')===String(cur.url).replace(/\/$/,'')) return;
  if(cur.variants&&cur.variants[v.url]){applyVariant(v.url);return}
  if(navigator.onLine===false||!native){toast('Sem internet. Verifique sua conexão e tente novamente.');return}
  toast('Carregando versão…');
  const selected=cur,token=srch.token,keep=cur.versions;
  fetchPage(v.url,'song').then(d=>{
    if(cur!==selected||token!==srch.token||!document.getElementById('cifra'))return;
    if(!d||!d.text){toast('Não consegui carregar esta versão. Tente novamente.');return}

    if(cur.id){cur.variants=cur.variants||{};cur.variants[v.url]={name,text:d.text,chords:d.chords||[],key:parseChord(d.key||'')?d.key:''};saveSongs();applyVariant(v.url)}
    else openImported(Object.assign(d,{versions:keep}),keep);

}
// ao salvar: baixa todas as versões para funcionar sem internet (os tons são calculados no aparelho)
async function downloadVariants(song,quiet){
  const persist=()=>{ if(song.id) saveSongs(); else if(cur===song) store.set('tc_pending',song); };
  song.variants=song.variants||{};
  const list=(song.versions||[]).filter(v=>!song.variants[v.url]);
  if(!list.length||!native||navigator.onLine===false) return;
  if(!quiet) toast(`Salvando ${list.length} outra(s) versão(ões) para usar sem internet…`);
  let ok=0;
  for(const v of list){
    const d=await fetchPage(v.url,'song');
    if(d&&d.text){song.variants[v.url]={name:/^esta vers/i.test(v.name)?'Principal':v.name,text:d.text,chords:d.chords||[],key:parseChord(d.key||'')?d.key:''};persist();ok++}
  }
  if(!quiet) toast(ok===list.length?'Todas as versões salvas no aparelho':`${ok} de ${list.length} versões salvas (verifique a internet)`);
}

function songKey(s){
  const k=s.key&&parseChord(s.key.trim());
  if(k) return k;
  for(const line of (s.text||'').split('\n')){
    const c=classify(line);
    if(c.type==='chords'){for(const t of c.rest.trim().split(/\s+/)){const x=splitTok(t);if(x)return x.p}}
    if(c.type==='inline'){const mm=/\[([^\]]+)\]/.exec(line);const p=mm&&parseChord(mm[1]);if(p)return p}
  }
  return null;
}
function keyLabel(s,shift){
  const k=songKey(s); if(!k) return '';
  const minor=/^(m(?!aj)|min)/.test(k.suffix);
  const idx=NOTE_IDX[k.root]+(shift||0);
  return (shift?nameOf(idx,isFlatKey(idx,minor)):k.root)+(minor?'m':'');
}

/* ================= Leitura da cifra ================= */
const LABEL_RE=/^(\s*)(\[[^\]]+\]|[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ0-9 ]{0,24}:)/;
// limpa espaços especiais e caracteres invisíveis que os sites colocam no meio da cifra
function normText(s){return String(s||'').replace(/[​-‏‪-‮⁠-⁤﻿]/g,'').replace(/[  -   　\t]/g,' ').replace(/\r/g,'')}
let CSET=new Set(), LYR=null, CMP=null;
// palavras duvidosas da legenda automática: ⟦palavra⟧ em vermelho; ⟪?⟫ = frase talvez errada (toque para corrigir)
function lyricHtml(line,i){
  return esc(line).replace(/⟦([^⟧]*)⟧/g,(m,w)=>`<span class="dw" data-l="${i}">${w}</span>`)
    .replace(/\s*⟪\?⟫/g,` <span class="dwn" data-l="${i}">⚠ confira</span>`);
}
function fixLine(i){
  const lines=String(cur.text||'').split(/\n/); if(lines[i]==null) return;
  const clean=lines[i].replace(/[⟦⟧]/g,'').replace(/\s*⟪\?⟫/g,'');
  const v=prompt('Corrija a frase:',clean); if(v==null) return;
  lines[i]=v; cur.text=lines.join(String.fromCharCode(10)); persistCur(); renderSong();
}
const nl=s=>normText(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/_/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); // acordes marcados pelo site de origem (<b>), para reconhecer mesmo nomes incomuns
const isChordTok=t=>splitTok(t)||CSET.has(t);
function classify(line){
  if(!line.trim()) return {type:'blank'};
  if(TAB_RE.test(line)) return {type:'tab'};
  let label='', rest=line;
  const m=LABEL_RE.exec(line);
  if(m){const inner=m[2].startsWith('[')?m[2].slice(1,-1):null;
    if(!(inner!==null&&parseChord(inner.trim()))){label=m[0];rest=line.slice(m[0].length);}}
  const toks=rest.trim().split(/\s+/).filter(Boolean);
  if(label&&!toks.length) return {type:'section',label};
  if(toks.length&&toks.every(t=>isChordTok(t)||NEUTRAL_RE.test(t))&&toks.some(isChordTok)) return {type:'chords',label,rest};
  if(/\[[A-G][^\]]*\]/.test(line)&&[...line.matchAll(/\[([^\]]+)\]/g)].some(x=>parseChord(x[1].trim()))) return {type:'inline'};
  return {type:'lyric'};
}
function chordSpan(txt){return `<span class="c" data-c="${esc(txt)}">${esc(txt)}</span>`}
function renderChordText(rest,tf){
  let out='',carry=0; const re=/(\s+)|(\S+)/g; let m;
  while((m=re.exec(rest))){
    if(m[1]){const n=Math.max(m.index===0?0:1,m[1].length-carry);carry-=m[1].length-n;out+=' '.repeat(n);continue}
    const t=m[2], x=splitTok(t);
    if(x){const nt=tf(x.p);carry+=nt.length-x.core.length;out+=esc(x.pre)+chordSpan(nt)+esc(x.post)}
    else if(CSET.has(t)) out+=chordSpan(t);
    else out+=esc(t);
  }
  return out;
}
function renderCifra(text,tf){
  const lines=normText(text).split('\n'); const out=[];
  const TAB_SEC=/tab\b|tablatura|dedilhado|riff|ponteado|solo de (viol|guit)|baixo/i;
  let skip=false; const lmap=[];
  for(let i=0;i<lines.length;i++){
    const line=lines[i]; const c=classify(line);
    // seções de violão/guitarra ([Tab - Intro], [Tab - Solo]...) somem por inteiro até a próxima seção
    if(c.label&&/\S/.test(c.label)&&/^\s*\[/.test(c.label)) skip=TAB_SEC.test(c.label);
    if(skip&&(c.type==='lyric'||c.type==='inline')) skip=false;
    if(skip) continue;
    if(/^\s*parte\s+\d+\s+de\s+\d+\s*$/i.test(line)) continue;
    if(c.type==='tab') continue;
    if(c.type==='chords'&&i+1<lines.length&&classify(lines[i+1]).type==='tab') continue; // acordes de cima da tablatura
    if(c.type==='blank'){ if(out.length&&out[out.length-1]!=='') out.push(''); continue }
    else if(c.type==='section') out.push(`<span class="sec">${esc(c.label.trim())}</span>`);
    else if(c.type==='chords') out.push((c.label?`<span class="sec">${esc(c.label)}</span>`:'')+renderChordText(c.rest,tf));
    else if(c.type==='inline'){
      let chordLine='',plain=0,lyric='',last=0,pos=0; const re=/\[([^\]]+)\]/g; let m;
      while((m=re.exec(line))){
        lyric+=line.slice(pos,m.index); pos=m.index+m[0].length;
        const p=parseChord(m[1].trim());
        if(!p){lyric+=m[0];continue}
        const nt=tf(p); const at=Math.max(lyric.length,last);
        chordLine+=' '.repeat(Math.max(0,at-plain))+chordSpan(nt); plain=at+nt.length;
        last=plain+1;
      }
      lyric+=line.slice(pos);
      out.push(chordLine); out.push(esc(lyric));
    }
    else { if(c.type==='lyric') lmap.push({n:nl(line),idx:out.length}); out.push(lyricHtml(line,i)); }
  }
  while(out.length&&out[out.length-1]==='') out.pop();
  // confere com a letra completa: linhas que faltam entram no lugar certo, marcadas em azul
  CMP=null;
  if(Array.isArray(LYR)&&LYR.length){
    const ins={}; let anchor=-1, total=0, missing=0;
    for(const l of LYR){
      const n=nl(l); if(n.length<4) continue; total++;
      const m=lmap.find(x=>x.n===n||(n.length>=10&&x.n.length>=10&&(x.n.includes(n)||n.includes(x.n))));
      if(m){anchor=m.idx;continue}
      missing++; (ins[anchor]=ins[anchor]||[]).push(l);
    }
    Object.keys(ins).map(Number).sort((a,b)=>b-a).forEach(a=>{
      out.splice(a+1,0,'<span class="misstag">▼ trecho da letra que não está nesta cifra</span>',...ins[a].map(x=>`<span class="miss">${esc(x)}</span>`));
    });
    CMP={total,missing};
  }
  return out.join('\n');
}

// baixa a letra (página "Letra" do Cifra Club) por trás para conferir se a cifra está completa
const lyrLoading=new Set();
function fetchLyrics(song){
  const m=/^(https:\/\/(?:www|m)\.cifraclub\.com\.br\/[^/]+\/[^/]+\/)/.exec(song.url||'');
  if((Array.isArray(song.lyrics)&&song.lyricsV===2)||!m||!native||navigator.onLine===false||lyrLoading.has(song.url)) return;
  const key=song.url; lyrLoading.add(key);
  if(cur===song) renderSong();
  fetchPage(m[1]+'letra/','lyrics').then(d=>{
    lyrLoading.delete(key);
    if(d&&d.lines){ song.lyrics=d.lines; song.lyricsV=2; if(song.id) saveSongs(); else if(cur===song) store.set('tc_pending',song); }
    if(cur===song&&location.hash.indexOf('song')+location.hash.indexOf('preview')>-2) renderSong();
  });
}
function renderToolbar(){
  const b=(k,ic,t,fn,cls)=>`<button class="${cls||''}" onclick="${fn}">${ic}<span>${t}</span></button>`;
  const saved=!!cur.id;
  document.getElementById('stb').innerHTML=
    b('tom',I.tom,'Tom',"togglePanel('tom')",panel==='tom'?'on':'')+

}
function renderSong(){
  const s=cur;if(!s)return;const shift=((s.transpose||0)%12+12)%12;
  const k=songKey(s); const minor=k&&/^(m(?!aj)|min)/.test(k.suffix);
  const flats=k?isFlatKey(NOTE_IDX[k.root]+shift,minor):false;
  const seen=[]; const tf=p=>{const t=transformChord(p,shift,flats,prefs.simple);if(!seen.includes(t))seen.push(t);return t};
  const pre=document.getElementById('cifra');
  if(!pre||!s)return;
  pre.style.fontSize=prefs.font+'px';
  CSET=new Set(s.chords||[]); LYR=null; // cifra exatamente como no site, sem inserir nada
  CifraLayout.render(pre,renderCifra(s.text||'',tf)+'<span class="fim">— fim da cifra —</span>',{flow:!!s.auto,source:!s.auto});
  prepararSync(); junto.i=-1;
  const cm=document.getElementById('cmp');
  if(cm){
    if(CMP&&CMP.missing===0){cm.className='cmp ok';cm.textContent='✓ Versão completa (conferida com a letra da música)'}
    else if(CMP){cm.className='cmp bad';cm.textContent=`⚠ Versão incompleta: ${CMP.missing} linha(s) da letra não estão nesta cifra. Elas aparecem marcadas em azul no lugar onde faltam.`}
    else if(lyrLoading.has(s.url)){cm.className='cmp wait';cm.textContent='Conferindo com a letra da música…'}
    else if(s.auto){cm.className='cmp wait';cm.textContent=s.youtubeCaptions?'Montada com os acordes do áudio e a legenda do YouTube. Confira o alinhamento e corrija o que precisar.':s.transcription?'Montada a partir do áudio, com acordes e transcrição sincronizados. Confira e corrija o que precisar.':s.caps?'Montada pelo app com a legenda do vídeo. Palavras em vermelho podem estar erradas: toque nelas para corrigir. Os acordes são uma estimativa.':'Cifra montada pelo app a partir do áudio. Os acordes são uma estimativa: confira de ouvido.'}
    else {cm.className='';cm.textContent=''}
  }
  chordsInOrder=seen;
  if(bar.sel&&!seen.includes(bar.sel)) bar.sel=null;
  document.getElementById('key').textContent=keyLabel(s,shift)||'—';
  renderBar(); renderPanel(); renderToolbar();
}

function renderBar(){
  const el=document.getElementById('cbar'); if(!el) return;
  const visible=prefs.pin||bar.open;

  if(!visible){el.innerHTML='';return}
  const left=el.querySelector('.cbs')?el.querySelector('.cbs').scrollLeft:0;
  const selV=bar.sel&&voicing(bar.sel,bar.inv);
  el.innerHTML=`<div class="cbh"><span class="ttl">Acordes (${chordsInOrder.length})${bar.sel?` · <span style="color:var(--orange)">${esc(bar.sel)}</span>`:''}</span>
     ${selV&&selV.core>1?`<button class="pill" onclick="cycleInv()">${['Fundamental','1ª inversão','2ª inversão','3ª inversão'][bar.inv]}</button>`:''}
     <button class="pill ${prefs.pin?'on':''}" onclick="togglePin()">${I.pin}${prefs.pin?'Fixado':'Fixar'}</button>
     ${prefs.pin?'':`<button class="pill" aria-label="Fechar" onclick="closeBar()">${I.x}</button>`}</div>
   <div class="cbs" id="cbs">${chordsInOrder.map(c=>{
      const isSel=c===bar.sel; const v=voicing(c,isSel?bar.inv:0); if(!v) return '';
      const fl=flatsOf(c);
      return `<div class="cc ${isSel?'sel':''} ${c===bar.cur?'cur':''}" data-c="${esc(c)}"><b>${esc(c)}</b>${keyboardSVG(v,isSel?{size:'big',fingers:true,flats:fl}:{flats:fl})}${isSel?`<div class="nt">${v.bass!==null?`<span style="color:var(--bass)">baixo ${nameOf(v.bass,fl)}</span> · `:''}${v.notes.map(n=>nameOf(n,fl)).join(' – ')}</div>`:''}</div>`;
   }).join('')}</div>`;
  const cbs=el.querySelector('.cbs'); cbs.style.scrollBehavior='auto'; cbs.scrollLeft=left; cbs.style.scrollBehavior='';
  cbs.addEventListener('click',e=>{const c=e.target.closest('.cc');if(!c)return;bar.sel=bar.sel===c.dataset.c?null:c.dataset.c;bar.inv=0;renderBar();if(bar.sel)centerCard(bar.sel)});
}
function centerCard(c){
  const cbs=document.getElementById('cbs'); if(!cbs) return;
  const card=[...cbs.children].find(x=>x.dataset.c===c); if(!card) return;
  cbs.scrollTo({left:card.offsetLeft-cbs.clientWidth/2+card.offsetWidth/2,behavior:'smooth'});
}
function tapChord(c){
  bar.cur=c; bar.sel=null; bar.inv=0;
  if(!prefs.pin){bar.open=true;bar.openedAt=window.scrollY}
  document.querySelectorAll('#cifra .c.hl').forEach(x=>x.classList.remove('hl'));
  document.querySelectorAll('#cifra .c').forEach(x=>{if(x.dataset.c===c)x.classList.add('hl')});
  renderBar(); renderToolbar(); requestAnimationFrame(()=>centerCard(c));
}
function cycleInv(){const v=voicing(bar.sel,0);bar.inv=(bar.inv+1)%Math.min(4,v.core);renderBar();centerCard(bar.sel)}
function togglePin(){prefs.pin=!prefs.pin;bar.open=false;savePrefs();renderBar();renderToolbar();if(bar.sel)requestAnimationFrame(()=>centerCard(bar.sel))}
function toggleBar(){
  if(prefs.pin){prefs.pin=false;savePrefs();bar.open=false}
  else if(bar.open) bar.open=false;
  else {bar.open=true;bar.openedAt=window.scrollY}
  renderBar(); renderToolbar();
}
function closeBar(){bar.open=false;bar.sel=null;document.querySelectorAll('#cifra .c.hl').forEach(x=>x.classList.remove('hl'));renderBar();renderToolbar()}
// com a barra fixada, ela acompanha o acorde que está no topo da tela
let scrollTick=false;
function onSongScroll(){
  if(scrollTick) return; scrollTick=true;
  requestAnimationFrame(()=>{
    scrollTick=false;
    if(!prefs.pin&&bar.open&&Math.abs(window.scrollY-bar.openedAt)>220&&!scroller){closeBar();return}
    if(!prefs.pin) return;
    const cb=document.getElementById('cbar'); if(!cb) return;
    const top=cb.getBoundingClientRect().bottom+4;
    let found=null;
    for(const sp of document.querySelectorAll('#cifra .c')){ if(sp.getBoundingClientRect().bottom>top){found=sp.dataset.c;break} }
    if(found&&found!==bar.cur){
      bar.cur=found;
      document.querySelectorAll('#cbs .cc').forEach(x=>x.classList.toggle('cur',x.dataset.c===found));
      if(!bar.sel) centerCard(found);
    }
  });
}

       <div class="tgrid">${Array.from({length:12},(_,pc)=>{const sh=(pc-r+12)%12;
         return `<button class="${sh===t?'on':''}" onclick="cur.transpose=${sh};persistCur();renderSong()">${nameOf(pc,isFlatKey(pc,minor))}${minor?'m':''}${sh===0?'<small>original</small>':''}</button>`}).join('')}</div>`;
    }
  }
  else if(panel==='rol') el.innerHTML=`<div class="prow"><button class="btn sm" style="min-width:110px" onclick="toggleScroll()">${scroller?'Pausar':'Iniciar'}</button>

  else if(panel==='txt') el.innerHTML=`<div class="prow"><b>Tamanho do texto</b><div class="step"><button onclick="setFont(-1)">A−</button><span class="v" id="fsv">${prefs.font}</span><button onclick="setFont(1)">A+</button></div></div>`;
  else el.innerHTML='';
}
function persistCur(){ if(cur.id) saveSongs(); else store.set('tc_pending',cur); }

/* ----- cifra montada: tocar junto e corrigir acordes ----- */
// cur.sync.t = tempo (s) de cada acorde escrito, na ordem do texto. Só vale enquanto o texto tiver o mesmo número de
// acordes (editar a cifra à mão apaga os tempos). cur.marcas[i] = {ok, c} guarda o ✔/✘ de cada acorde.
let junto={on:false,d:0,frac:0,at:0,raf:0,i:-1}, corr={on:false};
const syncOk=()=>{const sp=document.querySelectorAll('#cifra .c');return cur&&cur.sync&&cur.sync.t&&sp.length===cur.sync.t.length?sp:null};
function prepararSync(){
  const ui=document.getElementById('syncui'); if(!ui) return;
  const sp=syncOk(); if(!sp){ui.innerHTML='';return}
  const m=cur.marcas||{};
  sp.forEach((x,i)=>{x.dataset.i=i; const k=m[i]; if(k){x.classList.add(k.ok?'mk-ok':'mk-err'); if(!k.ok&&k.c) x.title='IA: '+k.ia}});
  const n=Object.keys(m).length;
  ui.innerHTML=`<div class="syncui">${cur.yt&&native?`<button class="btn sm ${junto.on?'':'ghost'}" onclick="${junto.on?'pararJunto()':'tocarJunto()'}">${junto.on?'■ Parar':'▶ Tocar junto'}</button>`:''}
    <button class="btn sm ${corr.on?'':'ghost'}" onclick="corr.on=!corr.on;prepararSync()">✎ ${corr.on?'Corrigindo: toque num acorde':'Corrigir acordes'}</button>
    ${n?`<span class="hint">${n} acorde(s) conferido(s)</span>`:''}</div>`;
  document.getElementById('cifra').classList.toggle('corrigindo',corr.on);
}
function tocarJunto(){
  if(!native||!cur.yt) return;
  junto={on:true,d:0,frac:0,at:performance.now(),raf:0,i:-1};
  document.body.classList.add('tocando'); native.playerStart(cur.yt,1); prepararSync();
  const passo=()=>{ if(!junto.on) return;
    const t=junto.d?junto.frac*junto.d+(performance.now()-junto.at)/1000:-1, T=cur.sync.t; let i=-1;
    for(let a=0,b=T.length-1;a<=b;){const m=(a+b)>>1; if(T[m]<=t+0.1){i=m;a=m+1}else b=m-1}   // último acorde que já começou
    if(i!==junto.i){const sp=syncOk(); if(sp){if(sp[junto.i])sp[junto.i].classList.remove('agora');
      if(sp[i]){sp[i].classList.add('agora'); const r=sp[i].getBoundingClientRect(); if(r.top<260||r.bottom>innerHeight-220) sp[i].scrollIntoView({block:'center',behavior:'smooth'})}}
      junto.i=i}
    junto.raf=requestAnimationFrame(passo)};
  junto.raf=requestAnimationFrame(passo);
}
function pararJunto(){
  if(!junto.on) return; junto.on=false; cancelAnimationFrame(junto.raf);
  try{native&&native.playerStop()}catch(e){}
  document.body.classList.remove('tocando'); document.querySelectorAll('#cifra .c.agora').forEach(x=>x.classList.remove('agora')); prepararSync();
}
// acordes do texto na ordem em que a tela os desenha (linhas de acordes)
function acordesDoTexto(text){
  const out=[]; normText(text).split('\n').forEach(l=>{const c=classify(l); if(c.type!=='chords') return;
    c.rest.replace(/\S+/g,t=>{const x=splitTok(t); if(x||CSET.has(t)) out.push(x?x.core:t); return t})});
  return out;
}
function trocarAcordeNoTexto(text,i,novo){
  const L=normText(text).split('\n'); let k=0;
  for(let li=0;li<L.length;li++){const c=classify(L[li]); if(c.type!=='chords') continue;
    let achou=false; const rest=c.rest.replace(/\S+/g,t=>{const x=splitTok(t); if(!x&&!CSET.has(t)) return t;
      if(k++===i){achou=true; return x?x.pre+novo+x.post:novo} return t});
    if(achou){L[li]=L[li].slice(0,L[li].length-c.rest.length)+rest; return L.join('\n')}}
  return text;
}
function abrirCorrecao(i){
  const toks=acordesDoTexto(cur.text||''), ia=toks[i], t=cur.sync.t[i]; if(!ia) return;
  const shift=((cur.transpose||0)%12+12)%12, k=songKey(cur), minor=k&&/^(m(?!aj)|min)/.test(k.suffix);
  const flats=k?isFlatKey(NOTE_IDX[k.root]+shift,minor):false, p=parseChord(ia), mostra=p?transformChord(p,shift,flats,prefs.simple):ia;
  const sheet=document.createElement('div'); sheet.className='sheet-bg'; sheet.id='sheet';
  sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
  sheet.innerHTML=`<div class="sheet"><h2>Acorde <span style="color:var(--orange)">${esc(mostra)}</span> · ${fmtT(t)}</h2>
    <p class="hint" style="margin-top:0">Ouça esse trecho: a IA acertou este acorde?</p>
    <button class="btn" style="width:100%;background:#1f8a3b" onclick="salvarCorrecao(${i},true)">✔ Está certo</button>
    <div style="margin-top:14px"><b>✘ Está errado — qual é o certo?</b>
    <input class="in" id="corrIn" placeholder="ex.: E/G#, F#m, A9" autocapitalize="characters" style="margin-top:6px">
    <label class="hint" style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="corrTxt" checked> Trocar também na cifra</label>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="salvarCorrecao(${i},false)">Salvar correção</button></div></div>`;
  document.body.appendChild(sheet);
}
// correções guardadas só neste aparelho, só com consentimento, e NÃO são usadas para treinar a IA automaticamente.
// Cada uma: música, vídeo, instante, o que a IA disse, se estava certo e o acorde certo (no tom original da cifra).
// "conjunto" já separa treino e prova (1 em cada 5 músicas fica para prova) para um treino futuro.
function salvarCorrecao(i,ok){
  let novo=null;
  if(!ok){const v=(document.getElementById('corrIn').value||'').trim(), p=parseChord(v);
    if(!p){toast('Acorde inválido. Use, por exemplo: E/G#, F#m, A9');return}
    const shift=((cur.transpose||0)%12+12)%12, k=songKey(cur), minor=k&&/^(m(?!aj)|min)/.test(k.suffix);
    novo=shift?transformChord(p,(12-shift)%12,k?isFlatKey(NOTE_IDX[k.root],minor):false,false):v;   // volta para o tom original da cifra
    const ia=parseChord(acordesDoTexto(cur.text||'')[i]||''), q=parseChord(novo);
    if(ia&&q&&NOTE_IDX[ia.root]===NOTE_IDX[q.root]&&ia.suffix===q.suffix&&(ia.bass&&NOTE_IDX[ia.bass])===(q.bass&&NOTE_IDX[q.bass])){ok=true;novo=null}}   // digitou o mesmo acorde da IA: estava certo
  const trocar=!ok&&document.getElementById('corrTxt').checked;
  closeSheet();
  if(prefs.consentCorr==null){pedirConsentimento(()=>salvarCorrecaoOk(i,ok,novo,trocar));return}
  salvarCorrecaoOk(i,ok,novo,trocar);
}
function salvarCorrecaoOk(i,ok,novo,trocar){
  const ia=acordesDoTexto(cur.text||'')[i];
  cur.marcas=cur.marcas||{}; cur.marcas[i]={ok,c:novo,ia};
  if(prefs.consentCorr){
    const base=store.get('tc_correcoes',{v:1,itens:[]}), chave=String(cur.yt||cur.title||'');
    let h=0; for(const ch of chave) h=(h*31+ch.charCodeAt(0))>>>0;
    base.itens.push({id:uid(),data:new Date().toISOString(),musica:cur.title||'',artista:cur.artist||'',yt:cur.yt||null,origem:cur.caps?'montada com legenda':'montada',
      tempo:cur.sync.t[i],acorde_ia:ia,certo:ok,acorde_correto:ok?ia:novo,conjunto:h%5===0?'prova':'treino'});
    store.set('tc_correcoes',base);
  }
  if(trocar&&novo) cur.text=trocarAcordeNoTexto(cur.text,i,novo);
  persistCur(); renderSong(); toast(ok?'✔ Marcado como certo':'✘ Correção salva');
}
function pedirConsentimento(depois){
  const sheet=document.createElement('div'); sheet.className='sheet-bg'; sheet.id='sheet';
  sheet.innerHTML=`<div class="sheet"><h2>Guardar suas correções?</h2>
    <p class="hint" style="font-size:15px;margin-top:0">Suas correções (música, instante, acorde da IA e acorde certo) ficam guardadas <b>só neste aparelho</b>, sem o áudio.
    Elas <b>não são enviadas</b> a ninguém e <b>não treinam a IA sozinhas</b>: no futuro, se você quiser, podem ajudar a melhorar o TeclaCifra.
    Você pode exportar ou apagar tudo na tela Backup.</p>
    <button class="btn" style="width:100%" id="cSim">Sim, guardar</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" id="cNao">Não guardar (só corrigir a cifra)</button></div>`;
  document.body.appendChild(sheet);
  const fim=v=>{prefs.consentCorr=v;savePrefs();closeSheet();depois()};
  document.getElementById('cSim').onclick=()=>fim(true); document.getElementById('cNao').onclick=()=>fim(false);
}
function shiftKey(d){cur.transpose=((cur.transpose||0)+d+12)%12;persistCur();renderSong()}
function setFont(d){prefs.font=Math.max(11,Math.min(30,prefs.font+d));savePrefs();document.getElementById('cifra').style.fontSize=prefs.font+'px';const v=document.getElementById('fsv');if(v)v.textContent=prefs.font}
function openClip(){
  const q=[cur.title,cur.artist].filter(Boolean).join(' - ');
  const sheet=document.createElement('div'); sheet.className='sheet-bg'; sheet.id='sheet';
  sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});

    <p class="hint" style="font-size:15px;margin:0 0 16px">Pesquisa: <b style="color:var(--text)">${esc(q)}</b>${cur.version?` · versão ${esc(cur.version)}`:''}</p>
    <button class="btn" style="width:100%;background:#e62117" onclick="closeSheet();openUrl(ytSearch(cur))">Pesquisar no YouTube</button>
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Cancelar</button></div>`;

/* ----- rolagem automática ----- */
let scroller=null;
function toggleScroll(){scroller?stopScroll():startScroll();renderPanel();renderToolbar()}
function startScroll(){
  let pos=window.scrollY,last=performance.now();
  scroller={raf:0};
  const step=now=>{
    if(!scroller) return;
    const dt=Math.min(.1,(now-last)/1000); last=now;
    if(Math.abs(window.scrollY-pos)>3) pos=window.scrollY; // usuário arrastou
    pos+=dt*prefs.speed*9;
    window.scrollTo(0,pos);
    if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2){stopScroll();renderPanel();renderToolbar();return}
    scroller.raf=requestAnimationFrame(step);
  };
  scroller.raf=requestAnimationFrame(step);
}
function stopScroll(){if(scroller){cancelAnimationFrame(scroller.raf);scroller=null}}

/* ================= Salvar em playlist ================= */
function openSave(){
  const id=cur.id;
  const sheet=document.createElement('div'); sheet.className='sheet-bg'; sheet.id='sheet';
  sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet()});
  sheet.innerHTML=`<div class="sheet"><h2>Salvar em playlist</h2>
    <div id="plchk">${playlists.map(p=>`<label class="chk"><input type="checkbox" value="${p.id}" ${id&&p.items.includes(id)?'checked':''}>${esc(p.name)}<small>${p.items.length} música(s)</small></label>`).join('')||'<p class="hint">Você ainda não tem playlists. Crie uma abaixo.</p>'}</div>
    <div class="row" style="margin-top:12px"><input class="in" id="newpl" placeholder="Nova playlist (ex.: Culto domingo)"><button class="btn ghost sm" onclick="addPlFromSheet()">Criar</button></div>
    <p class="hint">A música é salva no aparelho e funciona sem internet. Ela entra no fim da playlist e a ordem só muda se você editar.</p>
    <button class="btn" style="width:100%" onclick="confirmSave()">Salvar</button></div>`;
  document.body.appendChild(sheet);
}
function addPlFromSheet(){
  const inp=document.getElementById('newpl'); const name=inp.value.trim(); if(!name) return;
  const p={id:uid(),name,items:[]}; playlists.push(p); savePls();
  const box=document.getElementById('plchk');
  if(box.querySelector('.hint')) box.innerHTML='';
  box.insertAdjacentHTML('beforeend',`<label class="chk"><input type="checkbox" value="${p.id}" checked>${esc(p.name)}<small>nova</small></label>`);
  inp.value='';
}
function confirmSave(){
  const checked=[...document.querySelectorAll('#plchk input')].map(i=>({id:i.value,on:i.checked}));
  const wasNew=!cur.id;
  if(wasNew){cur.id=uid();cur.updated=Date.now();songs.push(cur);saveSongs();store.set('tc_pending',null)}
  for(const c of checked){
    const p=playlists.find(x=>x.id===c.id); if(!p) continue;
    const has=p.items.includes(cur.id);
    if(c.on&&!has) p.items.push(cur.id);          // sempre no fim: a ordem nunca muda sozinha
    if(!c.on&&has) p.items=p.items.filter(x=>x!==cur.id);
  }
  savePls(); closeSheet();
  downloadVariants(cur);
  const n=checked.filter(c=>c.on).length;
  toast(n?`Salva em ${n} playlist(s)`:'Salva em Minhas músicas');
  if(wasNew){history.replaceState(null,'','#/song/'+cur.id);route()}
}
function closeSheet(){const el=document.getElementById('sheet');if(el)el.remove()}

function viewPlaylists(){

  </main>${nav('pls')}`;
}
function createPl(){const n=document.getElementById('npl').value.trim();if(!n)return;playlists.push({id:uid(),name:n,items:[]});savePls();viewPlaylists()}
function viewPlaylist(id,editing){
  const p=playlists.find(x=>x.id===id); if(!p){go('/playlists');return}
  p.items=p.items.filter(i=>songById(i));
  const rows=p.items.map((sid,i)=>{const s=songById(sid);return editing?
    `<div class="pli" data-id="${sid}"><span class="handle" aria-label="Arrastar">${I.grip}</span><div class="tx"><div class="t" style="font-weight:600">${esc(s.title)}</div><div class="a" style="font-size:13px;color:var(--muted)">${esc(s.artist)}</div></div><button class="ibtn" aria-label="Tirar da playlist" onclick="rmFromPl('${p.id}','${sid}')">${I.x}</button></div>`:
    `<div class="item" onclick="go('/song/${sid}/${p.id}')"><span class="n">${i+1}</span><div><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div><span class="k">${esc(keyLabel(s,s.transpose||0))}</span></div>`}).join('');
  app.innerHTML=`<header class="top"><button class="ibtn" aria-label="Voltar" onclick="${editing?`go('/playlist/${p.id}')`:`go('/playlists')`}">${I.back}</button><h1>${esc(p.name)}</h1>
   <button class="ibtn" aria-label="${editing?'Concluir':'Editar'}" onclick="go('/playlist/${p.id}${editing?'':'/editar'}')" style="color:var(--orange)">${editing?I.check:I.edit}</button></header>
  <main>${editing?`<label class="f">Nome da playlist</label><div class="row"><input class="in" id="pln" value="${esc(p.name)}"><button class="btn ghost sm" onclick="renamePl('${p.id}')">Renomear</button></div>
     <p class="hint">Segure o ícone ⠿ e arraste para mudar a ordem.</p>`:''}
   <div class="list" id="pll">${rows||'<div class="empty">Playlist vazia.<br>Abra uma música e toque em Salvar ou Playlist.</div>'}</div>
   ${editing?`<button class="btn danger" style="width:100%;margin-top:20px" onclick="delPl('${p.id}')">Excluir playlist</button>`:''}
  </main>${editing?'':nav('pls')}`;
  if(editing) enableDrag(document.getElementById('pll'),order=>{p.items=order;savePls()});
}
function rmFromPl(pid,sid){const p=playlists.find(x=>x.id===pid);p.items=p.items.filter(x=>x!==sid);savePls();viewPlaylist(pid,true)}

function delPl(pid){if(!confirm('Excluir esta playlist? As músicas continuam salvas em Minhas músicas.'))return;playlists=playlists.filter(x=>x.id!==pid);savePls();history.replaceState(null,'','#/playlists');route()}
// arrastar para reordenar (dedo ou mouse)
function enableDrag(list,onDone){
  list.addEventListener('pointerdown',e=>{
    const h=e.target.closest('.handle'); if(!h) return;
    e.preventDefault();
    const el=h.closest('.pli'); el.classList.add('drag'); h.setPointerCapture(e.pointerId);
    let auto=0,lastY=e.clientY;
    const place=()=>{
      const others=[...list.children].filter(i=>i!==el);
      const idx=others.filter(i=>{const r=i.getBoundingClientRect();return r.top+r.height/2<lastY}).length;
      const ref=others[idx]||null; if(el.nextSibling!==ref) list.insertBefore(el,ref);
    };
    const tick=()=>{ if(lastY<90) window.scrollBy(0,-8); else if(lastY>innerHeight-90) window.scrollBy(0,8); place(); auto=requestAnimationFrame(tick); };
    auto=requestAnimationFrame(tick);
    const move=ev=>{lastY=ev.clientY;place()};
    const up=()=>{cancelAnimationFrame(auto);el.classList.remove('drag');h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
      onDone([...list.querySelectorAll('.pli')].map(x=>x.dataset.id))};
    h.addEventListener('pointermove',move); h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up);
  });
}

/* ================= Montar: cifra a partir do áudio ================= */
// Como funciona: o áudio é cortado em pedaços de ~0,2 s; a FFT separa as frequências;
// elas são somadas nas 12 notas (chroma); cada pedaço é comparado com os desenhos dos acordes
// (maior, menor, 7, m7) e uma suavização (Viterbi) escolhe a sequência mais provável.
I.wand=svg('<path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8l1.4 1.4M17.8 6.2l1.4-1.4M12.2 6.2l-1.4-1.4M3 21l9-9"/>');
const AN={SR:11025,N:4096,H:2048};
function fft(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
  for(let len=2;len<=n;len<<=1){
    const a=-2*Math.PI/len, wr=Math.cos(a), wi=Math.sin(a);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;
      for(let j=0;j<len/2;j++){
        const k=i+j, l=k+len/2, tr=re[l]*cr-im[l]*ci, ti=re[l]*ci+im[l]*cr;
        re[l]=re[k]-tr; im[l]=im[k]-ti; re[k]+=tr; im[k]+=ti;
        const nr=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=nr;
      }}
  }
}
// os 4 primeiros tipos são os do método antigo (TPL[0..47] = raiz*4+tipo); os demais só aparecem pela IA de 170 acordes
const CH_TYPES=[{s:'',iv:[0,4,7],w:[1.2,1,1],pen:0},{s:'m',iv:[0,3,7],w:[1.2,1,1],pen:0,minor:1},{s:'7',iv:[0,4,7,10],w:[1.2,1,1,.45],pen:.09},{s:'m7',iv:[0,3,7,10],w:[1.2,1,1,.45],pen:.09,minor:1},
  {s:'dim',iv:[0,3,6],minor:1},{s:'aug',iv:[0,4,8]},{s:'m6',iv:[0,3,7,9],minor:1},{s:'6',iv:[0,4,7,9]},{s:'m(7M)',iv:[0,3,7,11],minor:1},
  {s:'7M',iv:[0,4,7,11]},{s:'º',iv:[0,3,6,9],minor:1},{s:'m7(b5)',iv:[0,3,6,10],minor:1},{s:'sus2',iv:[0,2,7]},{s:'sus4',iv:[0,5,7]}];
const TPL=[], TPL_BASE=48, NX=CH_TYPES.length-4;
const mkTpl=(r,ti)=>{const ty=CH_TYPES[ti],v=new Float32Array(12);ty.iv.forEach((x,i)=>v[(r+x)%12]=ty.w?ty.w[i]:1);
  const nrm=Math.hypot(...v);for(let i=0;i<12;i++)v[i]/=nrm;return {r,ti,v,pen:ty.pen||0}};
for(let r=0;r<12;r++) for(let ti=0;ti<4;ti++) TPL.push(mkTpl(r,ti));
for(let r=0;r<12;r++) for(let ti=4;ti<CH_TYPES.length;ti++) TPL.push(mkTpl(r,ti));   // TPL[48 + raiz*NX + (tipo-4)]
const tplIndex=(r,ti)=>ti<4?r*4+ti:TPL_BASE+r*NX+(ti-4);
// IA de acordes: 'btc_weights_170.js' (170 acordes, validada no laboratório) ou 'btc_weights.js' (25, versão anterior)
const BTC_WEIGHTS_FILE=/[?&]btc=25\b/.test(location.search)?'btc_weights.js':'btc_weights_170.js';   // ?btc=25 só para teste
// qualidade da BTC 170 (ordem do modelo) -> tipo em CH_TYPES
const BTC_Q2T=[1,0,4,5,6,7,3,8,9,2,10,11,12,13];
const tick=()=>new Promise(r=>setTimeout(r,0));
// x: Float32Array mono a 11025 Hz → {segs:[{t0,t1,s}], key:{root,minor}}
async function analyzeAudio(x,onProg){
  const {SR,N,H}=AN, T=Math.floor((x.length-N)/H)+1;
  if(T<20) throw new Error('Áudio muito curto');
  const win=new Float64Array(N); for(let i=0;i<N;i++) win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  const kLo=Math.ceil(50*N/SR), kHi=Math.floor(2000*N/SR);
  const pcOf=new Int8Array(kHi+1), wOf=new Float32Array(kHi+1), isBass=new Uint8Array(kHi+1);
  for(let k=kLo;k<=kHi;k++){const f=k*SR/N, m=69+12*Math.log2(f/440), r=Math.round(m), d=m-r;
    pcOf[k]=((r%12)+12)%12; wOf[k]=Math.exp(-d*d/0.08); isBass[k]=f<200?1:0}
  // faixa da voz (800–3500 Hz): serve para achar onde tem gente cantando
  const vLo=Math.ceil(800*N/SR), vHi=Math.floor(3500*N/SR);
  const C=new Float32Array(T*12), B=new Float32Array(T*12), E=new Float32Array(T), VB=new Float32Array(T);
  const re=new Float64Array(N), im=new Float64Array(N);
  for(let t=0;t<T;t++){
    const o=t*H; for(let i=0;i<N;i++){re[i]=x[o+i]*win[i];im[i]=0}
    fft(re,im);
    for(let k=kLo;k<=kHi;k++){const mg=Math.sqrt(re[k]*re[k]+im[k]*im[k]); if(!mg) continue;
      const v=Math.sqrt(mg)*wOf[k]; C[t*12+pcOf[k]]+=v; if(isBass[k]) B[t*12+pcOf[k]]+=v; E[t]+=mg}
    for(let k=vLo;k<=vHi;k++) VB[t]+=Math.sqrt(re[k]*re[k]+im[k]*im[k]);
    if(t%60===0){onProg&&onProg(t/T*0.85);await tick()}
  }
  // média móvel (~1,3 s) para estabilizar
  const sm=(A,w)=>{const R=new Float32Array(A.length);for(let t=0;t<T;t++){const a=Math.max(0,t-w),b=Math.min(T-1,t+w);
    for(let p=0;p<12;p++){let s=0;for(let u=a;u<=b;u++)s+=A[u*12+p];R[t*12+p]=s/(b-a+1)}}return R};
  const Cs=sm(C,3), Bs=sm(B,3);
  const eSorted=Array.from(E).sort((a,b)=>a-b), thr=eSorted[Math.floor(T*0.5)]*0.15;
  // acordes por batida: acha as batidas e junta as notas de cada uma (acorde muda quase sempre na batida)
  const dt=H/SR, beats=findBeats(x,SR), byBeat=beats.length>=8;
  let units;
  if(byBeat){units=[];if(beats[0]>0.3)units.push([0,beats[0]]);for(let i=0;i<beats.length-1;i++)units.push([beats[i],beats[i+1]]);units.push([beats[beats.length-1],T*dt])}
  else units=Array.from({length:T},(_,t)=>[t*dt,(t+1)*dt]);
  const U=units.length;
  let AC=Cs, AB=Bs, AE=E;
  if(byBeat){
    AC=new Float32Array(U*12); AB=new Float32Array(U*12); AE=new Float32Array(U);
    units.forEach(([a,b],u)=>{const f0=Math.min(T-1,Math.floor(a/dt)), f1=Math.min(T,Math.max(f0+1,Math.floor(b/dt)));
      for(let t=f0;t<f1;t++){AE[u]+=E[t]/(f1-f0);for(let p=0;p<12;p++){AC[u*12+p]+=C[t*12+p];AB[u*12+p]+=B[t*12+p]}}});
  }
  // Viterbi: estados 0..47 = acordes, 48 = sem acorde
  const S=TPL_BASE+1, NC=S-1, beta=14, SW=byBeat?1.5:3.2;
  let V=new Float32Array(S); const bp=new Uint8Array(U*S);
  for(let t=0;t<U;t++){
    const c=AC.subarray(t*12,t*12+12), b=AB.subarray(t*12,t*12+12);
    const nc=Math.hypot(...c)||1, bm=Math.max(...b)||1, silent=AE[t]<thr;
    let best=0; for(let s=1;s<S;s++) if(V[s]>V[best]) best=s;
    const NV=new Float32Array(S);
    for(let s=0;s<S;s++){
      let sc;
      if(s===NC) sc=silent?1:0.35;
      else if(silent) sc=0;
      else{const tp=TPL[s];let d=0;for(let i=0;i<12;i++)d+=c[i]*tp.v[i];sc=d/nc+0.08*b[tp.r]/bm-tp.pen}
      const stay=V[s], jump=V[best]-SW;
      if(stay>=jump){NV[s]=stay+beta*sc;bp[t*S+s]=s}else{NV[s]=jump+beta*sc;bp[t*S+s]=best}
    }
    V=NV;
    if(t%200===0){onProg&&onProg(0.85+0.1*t/U);await tick()}
  }
  let s=0; for(let i=1;i<S;i++) if(V[i]>V[s]) s=i;
  const path=new Uint8Array(U); for(let t=U-1;t>=0;t--){path[t]=s;s=bp[t*S+s]}
  const segs=[];
  for(let t=0;t<U;t++){const st=path[t],[a,b]=units[t]; if(segs.length&&segs[segs.length-1].s===st) segs[segs.length-1].t1=b; else segs.push({s:st,t0:a,t1:b})}
  const minDur=byBeat?0.3:0.6;
  const clean=[]; for(const g of segs){ if(g.t1-g.t0<minDur&&clean.length){clean[clean.length-1].t1=g.t1;continue}
    if(clean.length&&clean[clean.length-1].s===g.s){clean[clean.length-1].t1=g.t1;continue} clean.push(g)}
  // tom: perfis de Krumhansl sobre a soma das notas
  const tot=new Float32Array(12); for(let t=0;t<T;t++) if(E[t]>=thr) for(let p=0;p<12;p++) tot[p]+=Cs[t*12+p];
  const MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88], MIN=[6.33,2.68,3.52,5.38,2.6,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
  const corr=(a,b)=>{const ma=a.reduce((x,y)=>x+y)/12, mb=b.reduce((x,y)=>x+y)/12;let n=0,da=0,db=0;for(let i=0;i<12;i++){n+=(a[i]-ma)*(b[i]-mb);da+=(a[i]-ma)**2;db+=(b[i]-mb)**2}return n/Math.sqrt(da*db||1)};
  let key={root:0,minor:false,c:-2};
  for(let r=0;r<12;r++){const rot=i=>tot[(i+r)%12], arr=Array.from({length:12},(_,i)=>rot(i));
    const a=corr(arr,MAJ), b=corr(arr,MIN); if(a>key.c) key={root:r,minor:false,c:a}; if(b>key.c) key={root:r,minor:true,c:b}}
  // trechos com voz: proporção de energia na faixa da voz acima da mediana da música
  const ratio=new Float32Array(T); for(let t=0;t<T;t++) ratio[t]=E[t]>=thr?VB[t]/(E[t]||1):0;
  const rs=new Float32Array(T); for(let t=0;t<T;t++){let s2=0,n=0;for(let u=Math.max(0,t-3);u<=Math.min(T-1,t+3);u++){s2+=ratio[u];n++}rs[t]=s2/n}
  const nz=Array.from(rs).filter(v=>v>0).sort((a,b)=>a-b), med=nz.length?nz[Math.floor(nz.length/2)]:0;
  let voice=[]; for(let t=0;t<T;t++){ if(rs[t]>med*1.05){const l=voice[voice.length-1]; if(l&&t*dt-l.t1<0.8) l.t1=(t+1)*dt; else voice.push({t0:t*dt,t1:(t+1)*dt})} }
  voice=voice.filter(v=>v.t1-v.t0>=1.2);
  // tom pelos acordes encontrados: o tom em que mais tempo de acorde "se encaixa" (I ii iii IV V vi), com peso extra na tônica
  const chordSegs=clean.filter(g=>g.s!==NC);
  if(chordSegs.length>=4){
    const MAJ_DEG=[[0,0],[2,1],[4,1],[5,0],[7,0],[9,1]]; // [grau, 0=maior 1=menor]
    let bestK=null, bestS=-1;
    for(let r=0;r<12;r++) for(const minor of [false,true]){
      const rel=minor?(r+3)%12:r; let sc=0;   // tom menor usa os acordes da relativa maior
      for(const g of chordSegs){const tp=TPL[g.s], q=CH_TYPES[tp.ti].minor?1:0, d=(tp.r-rel+12)%12, dur=g.t1-g.t0;
        if(MAJ_DEG.some(([dg,qq])=>dg===d&&qq===q)) sc+=dur;
        if(tp.r===r&&q===(minor?1:0)) sc+=dur*0.6}
      if(sc>bestS){bestS=sc;bestK={root:r,minor}}
    }
    key=bestK;
  }
  onProg&&onProg(1);
  return {segs:chordSegs,key,voice,dur:T*dt,beats};
}
// Batidas da música (leve, sem IA): envelope de ataques em janelas de 23 ms → andamento por autocorrelação
// → posição de cada batida por programação dinâmica (método de Ellis). Devolve os tempos em segundos.
function findBeats(x,SR){
  const hop=256, win=512, n=Math.floor((x.length-win)/hop), fps=SR/hop;
  if(n<fps*8) return [];
  const e=new Float32Array(n);
  for(let j=0;j<n;j++){let s=0;const o=j*hop;for(let i=0;i<win;i+=2)s+=x[o+i]*x[o+i];e[j]=Math.log(1e-9+s)}
  const on=new Float32Array(n); for(let j=1;j<n;j++) on[j]=Math.max(0,e[j]-e[j-1]);
  // tira a média local e normaliza
  const W=Math.round(fps/2), o2=new Float32Array(n); let acc=0;
  for(let j=0;j<n;j++){acc+=on[j];if(j>2*W)acc-=on[j-2*W-1];const m=acc/Math.min(j+1,2*W+1);o2[Math.max(0,j-W)]=Math.max(0,on[Math.max(0,j-W)]-m)}
  let sd=0; for(let j=0;j<n;j++) sd+=o2[j]*o2[j]; sd=Math.sqrt(sd/n)||1; for(let j=0;j<n;j++) o2[j]/=sd;
  // andamento: autocorrelação entre 60 e 190 bpm, preferindo perto de 110
  const lo=Math.round(fps*60/190), hi=Math.round(fps*60/60); let P=0, bestR=-1;
  for(let l=lo;l<=hi;l++){let r=0;for(let j=l;j<n;j++)r+=o2[j]*o2[j-l];
    const w=Math.exp(-0.5*Math.pow(Math.log2((60*fps/l)/110)/0.9,2)); if(r*w>bestR){bestR=r*w;P=l}}
  if(!P) return [];
  // programação dinâmica: cada batida ~P depois da anterior, caindo nos ataques
  const sc=new Float32Array(n), bk=new Int32Array(n).fill(-1);
  for(let j=0;j<n;j++){let best=-1e9,bi=-1;
    for(let k=j-2*P;k<=j-Math.round(P/2);k++){if(k<0)continue;const v=sc[k]-100*Math.pow(Math.log((j-k)/P),2);if(v>best){best=v;bi=k}}
    sc[j]=o2[j]+(bi>=0?best:0); bk[j]=bi}
  let j=n-1; for(let k=Math.max(0,n-P);k<n;k++) if(sc[k]>sc[j]) j=k;
  const out=[]; while(j>=0){out.push((j*hop+win/2)/SR); j=bk[j]}
  return out.reverse();
}
// ---- modelo de IA (BTC) ----
const half=x=>{const o=new Float32Array(x.length>>1);for(let i=0;i<o.length;i++)o[i]=(x[2*i]+x[2*i+1])*0.5;return o};   // 22050 → 11025 Hz

// classes do modelo (0..23: C, Cm, C#, C#m … ; 24 = sem acorde) → segmentos.
// Igual à tela de teste ("trocas rápidas", medido em 50 músicas): acorde escolhido por família (r.lab), cada quadro
// fica com o que 2 dos 3 vizinhos dizem, e trechos menores que 0,25 s se juntam ao anterior. Seguir as batidas foi
// testado e não ajudou, por isso as batidas não entram mais aqui.
function btcSegs(r){
  const fs=r.frameSec, NCLS=r.nClass||25, lab=r.lab||r.pred, tAt=g=>r.times?r.times[g]:g*fs;
  const st=NCLS===170?(c=>c>=168?-1:tplIndex((c/14)|0,BTC_Q2T[c%14])):(c=>c===24?-1:(c>>1)*4+(c&1));
  const s0=Array.from(lab,st), sm=s0.map((v,i)=>i>0&&i<s0.length-1&&s0[i-1]===s0[i+1]?s0[i-1]:v);
  const raw=[], cf=g=>r.conf?r.conf[g]:1;
  sm.forEach((s,g)=>{const l=raw[raw.length-1]; if(l&&l.s===s){l.t1=tAt(g)+fs;l.cs+=cf(g);l.n++} else raw.push({s,t0:tAt(g),t1:tAt(g)+fs,cs:cf(g),n:1})});
  const out=[]; for(const g of raw){ if(g.t1-g.t0<0.25&&out.length){const l=out[out.length-1];l.t1=g.t1;l.cs+=g.cs;l.n+=g.n;continue}
    const l=out[out.length-1]; if(l&&l.s===g.s){l.t1=g.t1;l.cs+=g.cs;l.n+=g.n;continue} out.push(g)}
  // conf: certeza média da IA no trecho (como na tela do PC: curto e incerto = acorde de dúvida)
  return out.filter(g=>g.s>=0).map(g=>({s:g.s,t0:g.t0,t1:g.t1,conf:g.cs/g.n}));
}
// tom pelos acordes: o tom em que mais tempo de acorde "se encaixa" (I ii iii IV V vi), com peso extra na tônica
function keyFromSegs(segs){
  const DEG=[[0,0],[2,1],[4,1],[5,0],[7,0],[9,1]]; let best=null, bs=-1;
  for(let r=0;r<12;r++) for(const minor of [false,true]){
    const rel=minor?(r+3)%12:r; let sc=0;
    for(const g of segs){const tp=TPL[g.s], q=CH_TYPES[tp.ti].minor?1:0, d=(tp.r-rel+12)%12, dur=g.t1-g.t0;
      if(DEG.some(([dg,qq])=>dg===d&&qq===q)) sc+=dur; if(tp.r===r&&q===(minor?1:0)) sc+=dur*0.6}
    if(sc>bs){bs=sc;best={root:r,minor}}
  }
  return best;
}
// acorde mais provável nos últimos ~1,5 s (para mostrar ao vivo)
function quickChord(x){
  const {SR,N}=AN; if(x.length<N*2) return '';
  const re=new Float64Array(N), im=new Float64Array(N), c=new Float32Array(12);
  for(let f=0;f<3;f++){const o=x.length-N-f*N/2; if(o<0) break;
    for(let i=0;i<N;i++){re[i]=x[o+i]*(0.5-0.5*Math.cos(2*Math.PI*i/(N-1)));im[i]=0}
    fft(re,im);
    for(let k=Math.ceil(50*N/SR);k<=Math.floor(2000*N/SR);k++){const fq=k*SR/N, m=69+12*Math.log2(fq/440);
      c[((Math.round(m)%12)+12)%12]+=Math.sqrt(Math.hypot(re[k],im[k]))}}
  const nc=Math.hypot(...c); if(nc<1) return '';
  let best=null,bs=-1; for(const tp of TPL.slice(0,TPL_BASE)){let d=0;for(let i=0;i<12;i++)d+=c[i]*tp.v[i];d=d/nc-tp.pen;if(d>bs){bs=d;best=tp}}
  return nameOf(best.r,false)+CH_TYPES[best.ti].s;
}
const fmtT=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
// Cifra sincronizada: distribui as linhas da letra pelos trechos com voz e põe cada acorde
// em cima do ponto da frase que estava sendo cantado quando ele tocou.
// Cada montagem devolve também o tempo (no vídeo) de cada acorde escrito, na ordem do texto: é com ele que a
// tela da música toca junto e guarda as correções.
// sequência de acordes em linhas de 4; blocos iguais seguidos viram "(2x)", "(3x)"… (o tempo fica o do 1º bloco)
function compactTimed(list){
  const ch=[]; for(let i=0;i<list.length;i+=4) ch.push(list.slice(i,i+4));
  const out=[]; ch.forEach(c=>{const k=c.map(x=>x.n).join('  '), l=out[out.length-1]; if(l&&l.k===k) l.v++; else out.push({k,v:1,ts:c.map(x=>x.t)})});
  return out.map(o=>({txt:o.k+(o.v>1?`  (${o.v}x)`:''),ts:o.ts}));
}
function buildSynced(res,lyrics,flats,ts){

  let voice=res.voice&&res.voice.length?res.voice:[{t0:res.segs.length?res.segs[0].t0:0,t1:res.dur}];
  const total=voice.reduce((a,v)=>a+v.t1-v.t0,0);
  const wts=L.map(l=>Math.max(4,l.replace(/[^\p{L}\p{N}]/gu,'').length)), W=wts.reduce((a,b)=>a+b,0);
  const timeAt=frac=>{let need=frac*total;for(const v of voice){const d=v.t1-v.t0;if(need<=d)return v.t0+need;need-=d}return voice[voice.length-1].t1};
  const chordAt=t=>{let c=null;for(const g of res.segs){if(g.t0<=t+0.05)c=g;else break}return c};
  const between=(a,b)=>res.segs.filter(g=>g.t0>=a&&g.t0<b);
  const rowOf=list=>{const out=[];list.forEach(g=>{const n=nm(g);if(!out.length||out[out.length-1].n!==n)out.push({n,t:g.t0*ts})});return out};

    // pausa curta até a próxima frase: os acordes que mudam nela entram no fim desta linha
    const lineEnd=i+1<L.length&&ST[i+1]-en<=3?ST[i+1]:en;
    // acordes desta linha: o que está soando no início + os que mudam durante a frase
    const list=[chordAt(st),...between(st+0.3,lineEnd)].filter(Boolean);

      const at=Math.max(pos,chordLine.length?col+1:0); chordLine+=' '.repeat(at-chordLine.length)+n; col=chordLine.length; tempos.push(g.t0*ts)});
    out.push(chordLine); out.push(line);

    prevEnd=en;

// Partes como no Cifra Club, pelas repetições da letra (testado na tela de teste): a estrofe que mais se repete é o
// [Refrão], a que vem sempre antes dele é o [Pré-Refrão], as outras são [Primeira Parte], [Segunda Parte]…, e uma
// que só aparece depois de dois refrões é a [Ponte]. Linhas que sempre vêm juntas, ou que não se repetem, viram uma parte só.
function nomearPartes(est){
  const pal=e=>new Set(e.linhas.flatMap(l=>l.clean.split(/\s+/).map(w=>norm(w).replace(/[^a-z0-9]/g,'')).filter(w=>w.length>2)));
  const sim=(a,b)=>{let n=0;for(const w of a)if(b.has(w))n++;return n/Math.max(1,Math.min(a.size,b.size))};
  let ng=0; const E0=est.filter(e=>e.linhas); E0.forEach((e,i)=>{e.p=pal(e);const o=E0.slice(0,i).find(o=>sim(o.p,e.p)>=0.6);e.g=o?o.g:ng++});
  const contar=()=>{const c={};est.forEach(e=>{if(e.linhas)c[e.g]=(c[e.g]||0)+1});return c};
  const colar=i=>{est[i].linhas.push(...est[i+1].linhas);for(const w of est[i+1].p)est[i].p.add(w);est.splice(i+1,1)};
  for(let mudou=true;mudou;){mudou=false;const c=contar();
    for(const x of Object.keys(c).map(Number)){if(c[x]<2)continue;
      const idx=est.map((e,i)=>e.linhas&&e.g===x?i:-1).filter(i=>i>=0), ys=new Set(idx.map(i=>est[i+1]&&est[i+1].linhas?est[i+1].g:null));
      if(ys.size===1&&!ys.has(null)&&!ys.has(x)){for(const i of idx.reverse())colar(i);mudou=true;break}}}
  {const c=contar();for(let i=0;i+1<est.length;)if(est[i].linhas&&est[i+1].linhas&&c[est[i].g]===1&&c[est[i+1].g]===1)colar(i);else i++}
  const E=est.filter(e=>e.linhas), cont={}, tam={};
  E.forEach(e=>{cont[e.g]=(cont[e.g]||0)+1;tam[e.g]=Math.max(tam[e.g]||0,e.p.size)});
  const rep=Object.keys(cont).map(Number).filter(g=>cont[g]>=2).sort((a,b)=>cont[b]-cont[a]||tam[b]-tam[a]);
  const refrao=rep.length?rep[0]:null, antesRef={};
  E.forEach((e,i)=>{if(e.g===refrao&&i&&E[i-1].g!==refrao)antesRef[E[i-1].g]=(antesRef[E[i-1].g]||0)+1});
  const pre=Object.keys(antesRef).map(Number).find(g=>antesRef[g]>=2&&cont[g]>=2)??null;
  const ORD=['Primeira','Segunda','Terceira','Quarta','Quinta','Sexta','Sétima','Oitava'], nomes={}; let np=0, refs=0;
  E.forEach(e=>{if(e.g===refrao){e.rot='Refrão';refs++;return} if(e.g===pre){e.rot='Pré-Refrão';return}
    if(!nomes[e.g]) nomes[e.g]=cont[e.g]===1&&refs>=2?'Ponte':`${ORD[np++]||np+'ª'} Parte`; e.rot=nomes[e.g]});
}
// texto final, como no Cifra Club, e o tempo de cada acorde escrito (na mesma ordem)
function escreverCifra(est){
  const L=[], tempos=[]; let ultRot=null;   // a mesma parte cantada de novo logo em seguida fica debaixo de um nome só
  for(const e of est){
    if(e.inst!=null){if(!e.ac.length) continue; L.push(''); if(e.inst) ultRot=null;
      compactTimed(e.ac).forEach((r,i)=>{L.push((i||!e.inst?'':`[${e.inst}] `)+r.txt);tempos.push(...r.ts)}); continue}
    L.push(''); if(e.rot!==ultRot) L.push(`[${e.rot}]`); ultRot=e.rot;
    for(const l of e.linhas){if(l.la){L.push(l.la);tempos.push(...l.tl)} L.push(l.texto)}
  }
  return {text:L.join('\n').replace(/\n{3,}/g,'\n\n').trim(),tempos};
}
// Cifra a partir da legenda do YouTube: cada acorde fica em cima da palavra que estava sendo cantada.
// Acordes antes da voz são [Intro], pausas de 6 s ou mais sem voz são [Solo] e o que sobra no fim é o [Final].
// Marcas da legenda ([Música], (aplausos), ♪) saem da letra, mesmo no meio da frase.
// Palavras com baixa confiança (legenda automática) ficam marcadas ⟦assim⟧ e aparecem em vermelho.
function buildFromCaptions(res,caps,ts,flats){
  const nm=g=>nameOf(TPL[g.s].r,flats)+CH_TYPES[TPL[g.s].ti].s;
  // como na tela do PC: acordes de dúvida (menos de 1,5 s e certeza abaixo de 70%) ficam fora para a cifra sair limpa
  const ac=[]; res.segs.filter(g=>!(g.conf!=null&&g.t1-g.t0<1.5&&g.conf<0.7)).forEach(g=>{const n=nm(g); if(!ac.length||ac[ac.length-1].n!==n) ac.push({n,t:g.t0*ts})});   // tempo do vídeo

  const lines=[];

  else{
    let curL=[], len=0, last=-9;

      if(curL.length&&(w.t-last>0.7||len+w.w.length>38)){lines.push(curL);curL=[];len=0}
      curL.push(w); len+=w.w.length+1; last=w.t;

  const v0=res.voice&&res.voice.length?res.voice[0].t0*ts-1.5:-1;
  while(lines.length>1&&lines[0][lines[0].length-1].t<v0) lines.shift();

  const itens=[]; let ai=0, ultPal=0;

    const antes=[]; while(ai<ac.length&&ac[ai].t<ini) antes.push(ac[ai++]);
    const vazio=ws[0].t-ultPal, nesta=[];
    if(antes.length){const ult=antes[antes.length-1];
      if(li===0) itens.push({inst:'Intro',ac:antes}); else if(vazio>=6) itens.push({inst:'Solo',ac:antes}); else if(antes.length>1) itens.push({inst:'',ac:antes.slice(0,-1)});
      nesta.push({n:ult.n,t:ult.t,pos:ws[0].t})}   // o acorde que está soando quando a voz entra vai no começo da linha
    while(ai<ac.length&&ac[ai].t<fim) nesta.push(ac[ai++]);
    let clean='', text=''; const offs=[];
    ws.forEach((w,i)=>{if(i){clean+=' ';text+=' '} offs.push(clean.length); clean+=w.w; text+=(w.c!=null&&w.c<LOW)?'⟦'+w.w+'⟧':w.w});
    const doubt=ws.filter(w=>w.c!=null&&w.c<LOW).length; if(doubt>=2||doubt/ws.length>=0.4) text+=' ⟪?⟫';
    let la=''; const tl=[];
    nesta.forEach(a=>{const p=a.pos??a.t; let wi=0; ws.forEach((w,i)=>{if(w.t<=p+0.15)wi=i});
      const at=Math.max(p<ws[0].t?0:offs[wi],la.length?la.length+1:0); la+=' '.repeat(at-la.length)+a.n; tl.push(a.t)});

  const est=[]; for(const x of itens){const u=est[est.length-1]; if(x.inst!=null) est.push(x); else if(x.nova||!u||u.inst!=null) est.push({linhas:[x]}); else u.linhas.push(x)}
