}
function buildCifraText(res,timeScale,lyrics){
  const flats=isFlatKey(res.key.root,res.key.minor), lines=[], tempos=[], key=nameOf(res.key.root,flats)+(res.key.minor?'m':'');
  if(lyrics&&lyrics.length>=4&&res.segs.length){const b=buildSynced(res,lyrics,flats,timeScale);return {text:b.text,tempos:b.tempos,key,synced:true}}
  let row=[], start=0;
  res.segs.forEach((g,i)=>{
    if(!row.length) start=g.t0*timeScale;
    const nm=nameOf(TPL[g.s].r,flats)+CH_TYPES[TPL[g.s].ti].s;
    if(!row.length||row[row.length-1].n!==nm) row.push({n:nm,t:g.t0*timeScale});
    if(row.length===4||i===res.segs.length-1){lines.push(`[${fmtT(start)}] `+row.map(x=>x.n).join('   '));tempos.push(...row.map(x=>x.t));row=[]}
  });

  if(lyrics&&lyrics.length) txt+='\n\n[Letra]\n'+lyrics.join('\n');
  return {text:txt,tempos,key};
}
async function lyricsByName(name){
  if(!name||!native||navigator.onLine===false) return null;
  // índice rápido do Letras.mus.br; tenta o nome inteiro e depois só o começo (sem os nomes dos cantores)
  const nn=norm(name).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(), words=nn.split(' ');
  let pick=null;
  for(const q of [nn,words.slice(0,5).join(' '),words.slice(0,4).join(' '),words.slice(0,3).join(' ')]){
    const raw=await httpGet('https://solr.sscdn.co/letras/m1/?q='+encodeURIComponent(q));
    let d=raw; if(typeof raw==='string'){try{d=JSON.parse(raw.slice(raw.indexOf('(')+1,raw.lastIndexOf(')')))}catch(e){d=null}}
    const docs=((d&&d.response&&d.response.docs)||[]).filter(x=>x.dns&&x.url&&x.txt);
    let best=-1;
    for(const x of docs){
      const t=norm(x.txt).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); if(!t||!nn.includes(t)) continue;   // o título tem que estar no nome
      const art=norm(x.art||'').split(/\s+/).filter(w=>w.length>2), hits=art.filter(w=>nn.includes(w)).length;
      // o nome tem mais que o título (tem o cantor)? então o cantor tem que bater: mesmo título pode ser outra música
      const extra=nn.replace(t,' ').split(' ').filter(w=>w.length>2).length;
      if(extra>0&&!hits) continue;
      const sc=t.length*2+hits*10; if(sc>best){best=sc;pick=x}
    }
    if(pick) break;
  }
  if(!pick) return null;
  const l=await fetchPage('https://www.letras.mus.br/'+pick.dns+'/'+pick.url+'/','lyrics');
  // tira o cabeçalho da página que às vezes vem junto (título, cantor, "Letra", "Traduções"…)
  if(l&&l.lines){
    const head=norm((pick.full_txt||'')+' '+(pick.art||'')+' letra traducoes traducao significado cifra');
    while(l.lines.length&&(head.includes(norm(l.lines[0]).trim())||/\(part\.|^(letra|tradu)/i.test(l.lines[0]))) l.lines.shift();
  }
  return l&&l.lines?l.lines:null;
}
// letra na descrição do vídeo: pega o maior bloco de linhas que parecem letra (sem links, créditos, redes sociais)
async function lyricsFromYouTube(id){
  if(!id||!native||navigator.onLine===false) return null;
  const d=await fetchPage('https://m.youtube.com/watch?v='+id,'ytdesc');
  if(!d||!d.desc) return null;
  const bad=/\d{1,2}:\d{2}|^[-–•]|\btime\b|https?:|www\.|@|#|inscreva|instagram|facebook|tiktok|spotify|deezer|youtube|whats|contato|shows?:|produ[cç][aã]o|composi|autor|ficha|cr[eé]ditos|grava|mixag|master|arranjo|dire[cç][aã]o|edi[cç][aã]o|capta[cç]|lan[cç]amento|ouça|ou[cç]a|baixe|dispon[ií]vel|copyright|℗|©|letra:|\b(ft|feat)\b/i;
  let best=[], cur=[];
  for(const raw of d.desc.split(/\r?\n/)){
    const l=raw.trim();
    if(l&&!bad.test(l)&&l.length<=90&&/\p{L}/u.test(l)) cur.push(l);
    else if(!l&&cur.length) cur.push('');               // linha em branco entre estrofes continua o bloco
    else { if(cur.filter(Boolean).length>best.filter(Boolean).length) best=cur; cur=[]; }
  }
  if(cur.filter(Boolean).length>best.filter(Boolean).length) best=cur;
  best=best.filter(Boolean);
  return best.length>=6?best:null;
}
function ytId(u){const m=/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/.exec(u||'');return m?m[1]:null}

// ---- estado e telas ----
// Montar pelo link, na mesma lógica da tela de teste do computador: o vídeo toca na velocidade normal, a IA analisa
// cada bloco de 10 s assim que ele chega e os acordes vão aparecendo. Ela foi treinada olhando blocos de 10 s, então
// analisar bloco a bloco dá o mesmo resultado de analisar o arquivo inteiro (como o computador faz).
// No fim, "Montar cifra" monta pela legenda do vídeo (ou pela letra de sites, se o vídeo não tiver legenda).
const BLOCO=22050*10;
const build={st:'idle',link:'',name:'',prog:0,live:'',msg:'',mode:'',rate:1,started:0,token:0,samples:[],len:0};
function novaAnalise(){Object.assign(build,{pend:[],pendLen:0,fila:[],nb:0,ocupado:false,fim:false,heard:false,samples:[],len:0,
  r:{lab:[],times:[],conf:[],T:0,frameSec:2048/22050,nClass:170},segs:[]})}
function viewBuild(){
  if(build.st==='run'){renderBuildRun();return}
  if(build.st==='ready'){renderBuildReady();return}
  if(build.st==='done'){
    app.innerHTML=`<header class="top"><h1>Montar cifra</h1></header><main><div class="card" style="text-align:center">
      <h3 style="font-size:20px">✓ Finalizado</h3><p class="hint">${esc(build.name||'Música')}: cifra montada a partir do áudio.</p>
      <button class="btn" style="width:100%" onclick="go('/preview')">Ver resultado</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="build.st='idle';viewBuild()">Montar outra</button></div></main>${nav('montar')}`;
    return;
  }
  app.innerHTML=`<header class="top"><h1>Montar cifra</h1></header><main>
   <div class="card"><h3>Pelo link do YouTube</h3>
     <p class="hint" style="margin-top:0">Cole o link e toque em Iniciar montagem. O app baixa o áudio do vídeo e a IA identifica os acordes, como no computador. No fim, toque em Montar cifra.</p>
     <input class="in" id="blink" placeholder="https://youtube.com/watch?v=..." inputmode="url" value="${esc(build.link)}">
     <button class="btn" style="width:100%;margin-top:10px" onclick="startBuildLink()">Iniciar montagem</button></div>
   <div class="card"><h3>Por um arquivo de áudio</h3>
     <p class="hint" style="margin-top:0">O mp3 do ensaio, por exemplo.</p>
     <input class="in" id="bname" placeholder="Nome da música (para buscar a letra)" value="${esc(build.name)}">
     <label class="btn ghost" style="display:block;text-align:center;margin-top:10px">Escolher arquivo de áudio<input type="file" accept="audio/*" style="display:none" onchange="startBuildFile(this.files[0])"></label></div>
   <p class="hint">Os acordes montados são uma estimativa, a partir das notas que soam na música. Confira de ouvido.</p>
  </main>${nav('montar')}`;
}
// acordes identificados até agora (os de dúvida — curtos e com certeza baixa — aparecem apagados, como no computador)
const duvidaSeg=g=>g.t1-g.t0<1.5&&g.conf!=null&&g.conf<0.7;
const nomeSeg=g=>nameOf(TPL[g.s].r,false)+CH_TYPES[TPL[g.s].ti].s;
function chipsHtml(){
  const s=build.segs||[]; if(!s.length) return '<span class="hint">Os acordes aparecem aqui a cada 10 segundos de música.</span>';
  return s.slice(-60).map(g=>`<span class="${duvidaSeg(g)?'duv':''}"><b>${esc(nomeSeg(g))}</b><small>${fmtT(g.t0)}</small></span>`).join('');
}
function renderBuildRun(){
  const p=Math.round(build.prog*100);
  if(build.mode==='file'){
    app.innerHTML=`<main style="padding-top:14px"><h3 style="margin:0 0 4px">Montando a cifra…</h3><p class="hint" style="margin:0 0 12px">${esc(build.name||'')}</p>
      <div style="background:var(--soft);border-radius:999px;height:12px;overflow:hidden"><div id="bbar" style="height:100%;width:${p}%;background:var(--orange)"></div></div>
      <p id="bmsg" class="hint">${esc(build.msg)} ${p}%</p><button class="btn ghost" style="width:100%" onclick="cancelBuild()">Cancelar</button></main>`;
    return;
  }
  const ouvindo=build.mode!=='baixar';   // baixando o áudio: sem vídeo no topo e sem "acorde agora"
  app.innerHTML=`${ouvindo?'<div style="height:204px"></div>':''}
   <main style="padding-top:12px"><h3 style="margin:0 0 2px">Montando… <span class="hint" style="font-weight:400">${esc(build.name||'')}</span></h3>
    <div style="background:var(--soft);border-radius:999px;height:10px;overflow:hidden;margin-top:8px"><div id="bbar" style="height:100%;width:${p}%;background:var(--orange)"></div></div>
    <p id="bmsg" class="hint">${esc(build.msg)} ${p}%</p>
    ${ouvindo?`<div class="bagora"><span class="hint">Acorde agora</span><b id="blive">${esc(build.live||'–')}</b></div>`:''}
    <div class="hint">Acordes identificados pela IA${build.caps?' · legenda do vídeo: sim':''}</div>
    <div class="bchips" id="bchips">${chipsHtml()}</div>
    ${ouvindo?`<button class="btn" style="width:100%" id="bmont" ${build.nb?'':'disabled'} onclick="pararEMontar()">Parar aqui e montar</button>`:''}
    <button class="btn ghost" style="width:100%;margin-top:8px" onclick="cancelBuild()">Cancelar</button></main>`;
}
function renderBuildReady(){
  const s=build.segs||[], k=s.length>=4?keyFromSegs(s):null;
  app.innerHTML=`<header class="top"><h1>Montar cifra</h1></header><main><div class="card">
     <h3 style="font-size:20px">✓ Montagem concluída</h3>
     <p class="hint" style="margin-top:0">${esc(build.name||'Música')}: a IA identificou ${s.filter(g=>!duvidaSeg(g)).length} acordes em ${fmtT(build.nb*10)} de música${k?` · tom provável <b style="color:var(--orange)">${nameOf(k.root,isFlatKey(k.root,k.minor))}${k.minor?'m':''}</b>`:''}.
     ${build.caps?'A cifra vai sair pela legenda do vídeo, com os acordes em cima das palavras.':'Este vídeo não tem legenda: a letra vem de sites de letras.'}</p>
     <div class="bchips">${chipsHtml()}</div>
     <button class="btn" style="width:100%" onclick="montarCifraAgora()">Montar cifra</button>
     <button class="btn ghost" style="width:100%;margin-top:8px" onclick="build.st='idle';viewBuild()">Começar de novo</button></div></main>${nav('montar')}`;
}
function setBuild(prog,msg){build.prog=Math.max(0,Math.min(1,prog));if(msg!=null)build.msg=msg;
  const b=document.getElementById('bbar'),m=document.getElementById('bmsg');
  if(b&&m){b.style.width=Math.round(build.prog*100)+'%';m.textContent=build.msg+' '+Math.round(build.prog*100)+'%'}}
function cancelBuild(){build.token++;build.st='idle';stopCapture();viewBuild()}
function stopCapture(){try{native&&native.captureStop();native&&native.playerStop()}catch(e){}}
async function startBuildLink(){
  const link=(document.getElementById('blink').value||'').trim(); build.link=link;
  if(!native){toast('Funciona no app Android');return}
  if(navigator.onLine===false){toast('Sem internet. Verifique sua conexão e tente novamente.');return}
  if(!isMusicLink(link)){toast('Cole um link do YouTube, Spotify ou Deezer');return}
  const token=++build.token; novaAnalise();
  Object.assign(build,{st:'run',prog:0,live:'',mode:'',name:'',msg:'Lendo o link…',caps:null,playing:false}); renderBuildRun();
  const name=await resolveLink(link); if(token!==build.token) return;
  build.name=name||''; renderBuildRun();
  let id=ytId(link);
  if(!id&&name){const d=await fetchPage('https://www.youtube.com/results?search_query='+encodeURIComponent(name),'yt'); id=d&&d.id}
  if(token!==build.token) return;
  if(!id){build.st='idle';viewBuild();toast('Não achei o vídeo desta música');return}
  build.vid=id; setBuild(0,'Procurando a legenda do vídeo…');
  const caps=await fetchPage('https://www.youtube.com/watch?v='+id,'ytcaps');   // como no computador: com legenda, a cifra sai por ela
  if(token!==build.token) return;
  build.caps=caps&&!caps.none&&caps.events&&caps.events.length?caps:null;
  setBuild(0,'Carregando a IA de acordes…');
  if(!await ensureBTC()){build.st='idle';viewBuild();toast('Não consegui carregar a IA de acordes');return}
  if(token!==build.token) return;
  // como no computador: baixa o áudio do vídeo e analisa o arquivo (sempre assim; se der erro, mostra o erro)
  build.mode='baixar'; build.extToken=token; renderBuildRun(); setBuild(0,'Lendo o vídeo…'); native.extrairAudio(id);
}
function erroMontagem(etapa,msg){
  console.error('TeclaCifra · '+etapa+': '+msg);
  build.st='idle';
  app.innerHTML=`<header class="top"><h1>Montar cifra</h1></header><main><div class="card">
     <h3>Não consegui ${esc(etapa)}</h3><p class="hint" style="margin-top:0">${esc(build.name||'')}</p>
     <p style="font-family:var(--mono);font-size:13px;background:var(--soft);padding:8px;border-radius:8px;word-break:break-word">${esc(msg||'erro desconhecido')}</p>
     <p class="hint">Confira a internet e tente de novo. Se o erro continuar, me mande esta mensagem.</p>
     <button class="btn" style="width:100%" onclick="startBuildLink()">Tentar de novo</button>
     <button class="btn ghost" style="width:100%;margin-top:8px" onclick="viewBuild()">Voltar</button>
     <input type="hidden" id="blink" value="${esc(build.link)}"></div></main>${nav('montar')}`;
}
// legenda no formato json3 do YouTube → o formato que a montagem usa ({auto, events:[{words:[{w,t,c}]}]}).
// A automática traz o tempo de cada palavra; na escrita só a frase tem tempo, então as palavras são espalhadas por ela.
function capsDeJson3(txt,auto,lang){
  let j; try{j=JSON.parse(txt)}catch(e){return null}
  const events=[];
  for(const e of j.events||[]){ if(!e.segs) continue;
    const t0=(e.tStartMs||0)/1000, d=(e.dDurationMs||0)/1000, words=[];
    e.segs.forEach(s=>{const t=t0+(s.tOffsetMs||0)/1000; String(s.utf8||'').split(/\s+/).filter(Boolean).forEach(w=>words.push({w,t,c:s.acAsrConf}))});
    if(!words.length) continue;
    if(!auto&&words.length>1) words.forEach((w,i)=>{w.t=t0+d*0.85*i/words.length;w.c=null});
    events.push({t:t0,words});
  }
  return events.length?{auto,lang,events}:null;
}
window.onExtrai=function(tipo,dado){
  if(build.st!=='run'||build.mode!=='baixar'||build.extToken!==build.token) return;
  if(tipo==='legenda'){const p=dado.indexOf('|'),q=dado.indexOf('|',p+1),c=capsDeJson3(dado.slice(q+1),dado.slice(0,p)==='1',dado.slice(p+1,q)); if(c) build.caps=c; return}
  if(tipo==='info') setBuild(0.02,'Lendo o vídeo…');
  else if(tipo==='progresso') setBuild(0.02+0.48*(+dado||0),'Baixando o áudio do vídeo…');
  else if(tipo==='ok') analisarExtraido();
  else if(tipo==='erro') erroMontagem('baixar o áudio',dado);
};
// o arquivo baixado vira 22050 Hz mono e vai para a IA em blocos de 10 s (os mesmos da montagem ao vivo)
async function analisarExtraido(){
  const token=build.token;
  try{
    setBuild(0.5,'Abrindo o áudio…');
    const ab=await (await fetch('https://teclacifra.audio/a?'+Date.now())).arrayBuffer();
    const ctx=new (window.AudioContext||window.webkitAudioContext)(); const buf=await ctx.decodeAudioData(ab); ctx.close&&ctx.close();
    const off=new OfflineAudioContext(1,Math.ceil(buf.duration*22050),22050), src=off.createBufferSource(); src.buffer=buf; src.connect(off.destination); src.start();
    const x=(await off.startRendering()).getChannelData(0); if(token!==build.token) return;
    for(let i=0;i<x.length;i+=BLOCO) if(x.length-i>22050*0.5) build.fila.push(x.slice(i,i+BLOCO));
    build.total=build.fila.length; build.fim=true; setBuild(0.5,'Identificando os acordes com IA…'); processarFila();
  }catch(e){if(token!==build.token) return; erroMontagem('abrir o áudio baixado',(e&&(e.name+': '+e.message))||String(e))}
}
window.onCapture=function(st){
  if(build.st!=='run'||build.mode==='file') return;
  if(st==='started'||st==='mic'){
    build.mode=st==='mic'?'mic':'internal'; build.started=Date.now();
    setBuild(0,st==='mic'?'Ouvindo pelo microfone…':'Ouvindo o vídeo…');
    if(!build.playing){build.playing=true;native.playerStart(build.vid,1)}   // velocidade normal: a IA ouve o som como ele é
  }else if(st==='denied'||st==='error'){
    toast('Usando o microfone (deixe o volume do celular audível)'); native.captureStart('mic');
  }else if(st==='nomic'){toast('Sem permissão para ouvir o áudio');cancelBuild()}
};
window.onPcm=function(b64){
  if(build.st!=='run'||build.fim) return;
  const bin=atob(b64), n=bin.length>>1, f=new Float32Array(n);
  for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8); if(v>32767)v-=65536; f[i]=v/32768}
  build.samples.push(f); if(build.samples.length>12) build.samples.shift(); build.len+=n;
  // som interno mudo depois de 8 s? troca para o microfone
  if(build.mode==='internal'&&Date.now()-build.started>8000&&!build.heard){
    let mx=0; for(const c of build.samples.slice(-8)) for(let i=0;i<c.length;i+=7) mx=Math.max(mx,Math.abs(c[i]));
    if(mx<0.002){build.heard=true;native.captureStop();toast('Não consegui ouvir o som interno; usando o microfone');novaAnalise();native.captureStart('mic');return}
  }
  if(!build.heard&&f.some(v=>Math.abs(v)>0.002)) build.heard=true;
  if(build.samples.length%2===0){const c=quickChord(half(concatF(build.samples.slice(-6))));if(c){build.live=c;const el=document.getElementById('blive');if(el)el.textContent=c}}
  // junta o som em blocos de 10 s e manda cada bloco para a IA
  build.pend.push(f); build.pendLen+=n;
  while(build.pendLen>=BLOCO){const x=concatF(build.pend); build.fila.push(x.slice(0,BLOCO)); const resto=x.slice(BLOCO); build.pend=[resto]; build.pendLen=resto.length}
  processarFila();
};
async function processarFila(){
  if(build.ocupado) return; build.ocupado=true; const token=build.token;
  try{
    while(build.fila.length){
      const x=build.fila.shift(), r=await BTC.recognize(x,null,tick); if(token!==build.token) return;
      if(r){const off=build.nb*10, R=build.r;   // tempos do bloco + início dele na música
        for(let t=0;t<r.T;t++){R.lab.push(r.lab[t]);R.times.push(r.times[t]+off);R.conf.push(r.conf[t])} R.T+=r.T}
      build.nb++; build.segs=btcSegs(build.r);
      if(build.mode==='baixar'&&build.total) setBuild(0.5+0.5*build.nb/build.total,'Identificando os acordes com IA…');
      const el=document.getElementById('bchips'); if(el){el.innerHTML=chipsHtml();el.scrollTop=el.scrollHeight}
      const bm=document.getElementById('bmont'); if(bm) bm.disabled=false;
    }
  }finally{build.ocupado=false}
  if(build.fim&&!build.fila.length&&token===build.token){build.st='ready';viewBuild()}
}
// o vídeo acabou (ou você tocou em "Parar aqui"): para de ouvir, analisa o último pedaço e libera o "Montar cifra"
function pararEMontar(){
  if(build.fim) return; build.fim=true; build.playing=false; stopCapture();
  if(build.pendLen>22050*0.5) build.fila.push(concatF(build.pend)); build.pend=[]; build.pendLen=0;
  setBuild(1,'Terminando a análise…'); processarFila();
}
window.onPlayer=function(type,v){
  if(junto.on){   // "Tocar junto" na tela da música: guarda duração e posição para o destaque acompanhar
    if(type==='ready') junto.d=v; else if(type==='time'){junto.frac=v;junto.at=performance.now()}
    else if(type==='error'){toast('O vídeo não pode ser tocado aqui');pararJunto()} else if(type==='state'&&v===0) pararJunto();
    return;
  }
  if(build.st!=='run'||build.mode==='file') return;
  if(type==='time') setBuild(v,build.msg);
  if(type==='error'){toast('O vídeo não pode ser tocado aqui');cancelBuild()}
  if(type==='state'&&v===0) pararEMontar();   // 0 = vídeo terminou
};
function concatF(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Float32Array(n);let p=0;arr.forEach(a=>{o.set(a,p);p+=a.length});return o}
// "Montar cifra": com legenda, os acordes caem em cima das palavras e as partes ganham nome (Intro, Refrão, Ponte…)
async function montarCifraAgora(){
  const segs=build.segs||[]; if(!segs.length){toast('A IA não identificou acordes nesta música');return}
  const key=segs.length>=4?keyFromSegs(segs):{root:0,minor:false}, flats=isFlatKey(key.root,key.minor), nk=nameOf(key.root,flats)+(key.minor?'m':'');
  const res={segs,voice:null,dur:build.nb*10,key};
  let b;
  if(build.caps) b={...buildFromCaptions(res,build.caps,1,flats),key:nk};
  else{toast('Buscando a letra…'); const lyr=(await lyricsByName(build.name))||(await lyricsFromYouTube(build.vid)); b=buildCifraText(res,1,lyr)}
  const pending={id:null,title:build.name||'Música montada',artist:'',key:b.key,yt:build.vid||'',text:b.text,chords:[],
    version:'Montada pelo app',versions:[],variants:{},auto:true,caps:!!build.caps,transpose:0,source:'Montada pelo app',url:'',updated:Date.now(),
    sync:b.tempos&&b.tempos.length?{t:b.tempos.map(x=>Math.round(x*100)/100)}:null};
  store.set('tc_pending',pending); build.st='idle'; build.vid=''; go('/preview');
}
async function finalize(x,timeScale,token,base){
  try{
    setBuild(base,'Identificando os acordes…');
    // x chega a 22050 Hz: batidas, voz e o método antigo usam a metade (11025); a IA usa os 22050
    const mid=base+(0.95-base)*0.3;
    const res=await analyzeAudio(half(x),p=>setBuild(base+(mid-base)*p,'Achando batidas e voz…'));
    if(await ensureBTC()){
      try{
        const r=await BTC.recognize(x,p=>setBuild(mid+(0.95-mid)*p,'Identificando os acordes com IA…'),tick);
        const segs=r&&btcSegs(r);
        if(segs&&segs.length){res.segs=segs; if(segs.length>=4) res.key=keyFromSegs(segs)}
      }catch(e){/* se a IA falhar, fica o resultado do método antigo */}
    }
    if(token!==build.token) return;
    setBuild(0.96,'Buscando a letra…');
    let b;
    if(build.caps){   // escolheu montar pela legenda do vídeo
      const flats=isFlatKey(res.key.root,res.key.minor);
      b={...buildFromCaptions(res,build.caps,timeScale,flats),key:nameOf(res.key.root,flats)+(res.key.minor?'m':'')};
    }else{
      // 1º Letras.mus.br (título + cantor) · 2º descrição do vídeo do YouTube
      const lyr=(await lyricsByName(build.name))||(await lyricsFromYouTube(build.vid));
      if(token!==build.token) return;
      b=buildCifraText(res,timeScale,lyr);
    }
    // sync: tempo (s, no vídeo/arquivo) de cada acorde escrito, na ordem do texto — para tocar junto e corrigir
    const pending={id:null,title:build.name||'Música montada',artist:'',key:b.key,yt:build.vid||'',text:b.text,chords:[],
      version:'Montada pelo app',versions:[],variants:{},auto:true,caps:!!build.caps,transpose:0,source:'Montada pelo app',url:'',updated:Date.now(),
      sync:b.tempos&&b.tempos.length?{t:b.tempos.map(x=>Math.round(x*100)/100)}:null};
    store.set('tc_pending',pending); build.st='done'; build.vid=''; viewBuild();
  }catch(e){toast(e.message||'Não consegui analisar este áudio');build.st='idle';viewBuild()}
}
async function startBuildFile(file){
  if(!file) return;
  const token=++build.token;
  build.name=(document.getElementById('bname').value||'').trim()||file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  Object.assign(build,{st:'run',mode:'file',prog:0,live:'',msg:'Lendo o arquivo…',vid:''}); renderBuildRun();
  try{
    const ab=await file.arrayBuffer();
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const buf=await ctx.decodeAudioData(ab); ctx.close&&ctx.close();
    if(token!==build.token) return;
    const off=new OfflineAudioContext(1,Math.ceil(buf.duration*22050),22050);
    const src=off.createBufferSource(); src.buffer=buf; src.connect(off.destination); src.start();
    const x=(await off.startRendering()).getChannelData(0);
    await finalize(x,1,token,0.05);
  }catch(e){toast('Não consegui ler este arquivo de áudio');build.st='idle';viewBuild()}
}

   <div class="card"><h3>${songs.length} música(s) · ${playlists.length} playlist(s)</h3><p class="hint">Tudo fica salvo só neste aparelho, sem conta. Se desinstalar o app, as músicas são apagadas, então faça backup de vez em quando.</p>
   <button class="btn" style="width:100%" onclick="exportData()">Exportar / compartilhar backup</button></div>
   <div class="card"><h3>Restaurar backup</h3><p class="hint">Cole o texto do backup e toque em Restaurar.</p>
   <textarea class="in" id="imp" style="min-height:140px"></textarea>
   <button class="btn ghost" style="width:100%;margin-top:10px" onclick="importData()">Restaurar</button></div>
   ${(()=>{const n=store.get('tc_correcoes',{itens:[]}).itens.length;return `<div class="card"><h3>Correções de acordes: ${n}</h3>
     <p class="hint">${prefs.consentCorr?'Você autorizou guardar as correções que faz nas cifras montadas.':prefs.consentCorr===false?'Você escolheu não guardar as correções.':'Nenhuma escolha ainda: o app pergunta na primeira correção.'}
     Ficam só neste aparelho, sem o áudio, e não treinam a IA sozinhas.</p>
     ${n?`<button class="btn" style="width:100%" onclick="exportCorr()">Exportar correções</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="apagarCorr()">Apagar correções</button>`:''}
     ${prefs.consentCorr!=null?`<button class="btn ghost" style="width:100%;margin-top:8px" onclick="prefs.consentCorr=${prefs.consentCorr?'false':'true'};savePrefs();viewBackup()">${prefs.consentCorr?'Parar de guardar':'Voltar a guardar'}</button>`:''}</div>`})()}
   <p class="hint" style="text-align:center">TeclaCifra 4.9 · feito para tecladistas · sem anúncios<br>Reconhecimento local de acordes e voz. Revise os resultados antes de salvar.</p></main>${nav('backup')}`;
}
function exportCorr(){
  const txt=JSON.stringify({app:'TeclaCifra',tipo:'correcoes',...store.get('tc_correcoes',{v:1,itens:[]})});
  if(native&&native.shareText){native.shareText('Correções TeclaCifra',txt);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='teclacifra-correcoes.json';a.click();
}
function apagarCorr(){if(!confirm('Apagar todas as correções guardadas?'))return;store.set('tc_correcoes',{v:1,itens:[]});viewBackup()}
function exportData(){
  const txt=JSON.stringify({app:'TeclaCifra',v:3,songs,playlists,prefs,correcoes:store.get('tc_correcoes',{v:1,itens:[]})});
  if(native&&native.shareText){native.shareText('Backup TeclaCifra',txt);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='teclacifra-backup.json';a.click();
}
function importData(){
  try{
    const d=JSON.parse(document.getElementById('imp').value);
    const list=Array.isArray(d)?d:d.songs; if(!Array.isArray(list)) throw 0;
    let n=0;
    for(const s of list){ if(!s||typeof s.text!=='string') continue;
      const clean={...s,id:String(s.id||uid()),title:String(s.title||'Sem título'),artist:String(s.artist||''),key:String(s.key||''),yt:String(s.yt||''),text:s.text,transpose:+s.transpose||0,source:String(s.source||''),url:String(s.url||''),updated:Date.now()};
      const i=songs.findIndex(x=>x.id===clean.id); if(i>=0) songs[i]=clean; else songs.push(clean); n++; }
    if(Array.isArray(d.playlists)) for(const p of d.playlists){ if(!p||!Array.isArray(p.items)) continue;
      const clean={id:String(p.id||uid()),name:String(p.name||'Playlist'),items:p.items.map(String)};
      const i=playlists.findIndex(x=>x.id===clean.id); if(i>=0) playlists[i]=clean; else playlists.push(clean); }
    if(d.prefs&&typeof d.prefs==='object'&&!Array.isArray(d.prefs)){prefs=Object.assign({},prefs,d.prefs);savePrefs();}
    if(d.correcoes&&Array.isArray(d.correcoes.itens)){const base=store.get('tc_correcoes',{v:1,itens:[]});const ids=new Set(base.itens.map(x=>x.id));for(const x of d.correcoes.itens)if(x&&x.id&&!ids.has(x.id)){base.itens.push(x);ids.add(x.id);}store.set('tc_correcoes',base);}
    saveSongs(); savePls(); applyTheme(); toast(n+' música(s) restaurada(s)'); viewBackup();
  }catch(e){toast('Backup inválido')}
}

/* Botão "voltar" do Android: retorna true se o app tratou */
window.appBack=function(){
  if(document.getElementById('sheet')){closeSheet();return true}
  if(panel){panel=null;renderPanel();renderToolbar();return true}
  if(bar.open&&document.getElementById('cbar')){closeBar();return true}
  const h=location.hash.replace(/^#/,'')||'/';
  if(h==='/') return false;
  if(/^\/(busca|playlists|acordes|backup|montar)$/.test(h)) go('/'); else history.back();
  return true;
};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
route();
